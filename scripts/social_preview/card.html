<!doctype html>
<!--
  The GitHub social preview (docs/social-preview.png), 1280x640. Rendered by make_card.py.
  The four No's and "No internet needed." as a statement, with the data folder's file list faint in two corners.
  GitHub crops about 12% off the top and bottom, and chat apps shrink the card to ~400px wide: keep every line of
  text between y 95 and 545, the list clear of the words, and the headline big. "AI" has a serifed I, or it reads
  as "Al". Check changes with DAST (docs/agents/working-with-kai.md): an earlier cable drawing failed it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Card Mono";
        src: url("../../frontend/node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2")
          format("woff2");
        font-weight: 100 800;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
      }
      body {
        position: relative;
        color: #2a1e3f;
        font-family: "Inter Display", Inter, system-ui, sans-serif;
        background: linear-gradient(115deg, #e9e4f8 0%, #f4f1fb 40%, #fcf6f0 72%, #f2f9f5 100%);
      }
      .line {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        white-space: nowrap;
      }
      .brand {
        top: 106px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-size: 34px;
        font-weight: 600;
      }
      .brand svg {
        width: 52px;
        height: 52px;
        flex: none;
      }
      h1 {
        top: 188px;
        font-size: 82px;
        line-height: 89px;
        font-weight: 800;
        letter-spacing: -0.025em;
      }
      h1 span {
        display: block;
      }
      h1 em {
        font-family: Inter, sans-serif;
        font-style: normal;
        font-feature-settings: "cv08" 1; /* the serifed I */
      }
      .offline {
        top: 390px;
        color: #5a4880;
        font-size: 56px;
        line-height: 64px;
        font-weight: 700;
        letter-spacing: -0.015em;
      }
      .foot {
        top: 492px;
        color: rgb(42 30 63 / 0.75);
        font-size: 27px;
        line-height: 34px;
        font-weight: 500;
      }
      /* The list is part of the background: it fades out towards the words. */
      .folder {
        position: absolute;
        inset: 0;
        overflow: hidden;
        -webkit-mask-image: radial-gradient(
          ellipse 590px 335px at 640px 335px,
          rgb(0 0 0 / 0.1) 0,
          rgb(0 0 0 / 0.1) 62%,
          #000 100%
        );
      }
      .tree {
        position: absolute;
        padding: 24px 30px;
        font:
          500 34px/52px "Card Mono",
          monospace;
        white-space: pre;
        opacity: 0.27;
        transform: rotate(-8deg);
      }
      .tree b {
        color: #5a4880;
        font-weight: 700;
      }
      .tree i {
        color: rgb(42 30 63 / 0.75);
        font-style: normal;
      }
    </style>
  </head>
  <body>
    <!-- What a data folder holds (src/jat/datadir.py); keep it true. -->
    <template id="list"><b>my-job-search/</b>
├─ tracker.sqlite3
├─ config.toml
├─ notes/   <i>Markdown</i>
├─ files/   <i>CVs, PDFs</i>
├─ export/  <i>JSON Lines</i>
└─ .git/    <i>optional</i></template>
    <div class="folder" aria-hidden="true">
      <div class="tree" style="left: -58px; top: -128px"></div>
      <div class="tree" style="left: 996px; top: 394px"></div>
    </div>

    <div class="line brand">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="plum" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#4a3a68" />
            <stop offset="1" stop-color="#2a1e3f" />
          </linearGradient>
        </defs>
        <rect width="24" height="24" rx="6" fill="url(#plum)" />
        <g fill="none" stroke="#fff" stroke-width="2">
          <circle cx="12" cy="12" r="8" />
          <circle cx="12" cy="12" r="4.5" />
          <circle cx="12" cy="12" r="1" />
        </g>
      </svg>
      <span>Job Application Tracker</span>
    </div>
    <h1 class="line"><span>No A<em>I</em>. No cloud.</span><span>No account. No tracking.</span></h1>
    <p class="line offline">No internet needed.</p>
    <p class="line foot">Your job search on your own machine · Open source · Free</p>

    <script>
      const list = document.getElementById("list").innerHTML;
      for (const el of document.querySelectorAll(".tree")) el.innerHTML = list;
    </script>
  </body>
</html>
