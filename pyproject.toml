[project]
name = "job-application-tracker"
version = "0.1.0"
description = "Self-hosted, local-first job application tracker for software engineers."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Kai Waddington" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.1",
    "uuid-utils>=1.0.0",
]

[project.scripts]
jat = "jat.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jat"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff.lint.per-file-ignores]
"src/jat/db/migrations/versions/*" = ["E501"]
