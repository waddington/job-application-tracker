# job-application-tracker delivery roadmap. The PM dashboard (tools/pm) reads this file.
#
# Strict YAML subset (the dashboard parses it with the standard library only): block mappings
# and lists, one-line scalars, [flow, lists] and one-line {flow: mappings}. No anchors and no
# multi-line strings.
#
# status: bug | planned | building | review | done | blocked
#   A task whose branch (worktree-<id>) or PR exists takes its LIVE status from git and
#   GitHub: building while the branch has commits but no PR, review while the PR is open,
#   done once merged. The status written here is the fallback when there's no live evidence.
# owner: lead (Claude) or kai (waiting on Kai).
# type: bug marks a bug (phase B, with severity: high | medium | low): it starts in the bug status
#   and keeps its BUG tag as a fix moves it along. Every bug found goes here (CLAUDE.md).
# detail: optional longer description, shown under a task's short name.
# estimate_h: agent hours.
# prd / rfc: optional repo-relative paths.

project: job-application-tracker
repo: waddington/job-application-tracker
start: 2026-09-30

phases:
  - id: P0
    name: Foundations
    goal: Planning, a PM dashboard and the stack decision
    tasks:
      - {id: prd-tracker, name: "Product PRD, roadmap and planning docs", owner: lead, status: done, estimate_h: 2, depends: [], prd: docs/prd/tracker.md}
      - {id: pm-dashboard, name: "PM dashboard web app (tools/pm)", owner: lead, status: done, estimate_h: 4, depends: [prd-tracker]}
      - {id: readme, name: "Public README: catchy, search- and LLM-friendly", owner: lead, status: done, estimate_h: 1.5, depends: [prd-tracker]}
      - {id: stack-rfc, name: "Stack and data-format RFC", owner: lead, status: done, estimate_h: 3, depends: [prd-tracker], prd: docs/prd/tracker.md, rfc: docs/rfc/stack.md}
      - {id: stack-gate, name: "Kai signs off the stack RFC", owner: kai, status: done, estimate_h: 0.5, depends: [stack-rfc]}

  - id: P1
    name: Core data and workflow
    goal: Data directory, schema, configurable workflow and a local JSON API
    tasks:
      - {id: data-dir, name: "Configurable data directory, init and backup layout", owner: lead, status: done, estimate_h: 2, depends: [stack-gate], prd: docs/prd/tracker.md, rfc: docs/rfc/stack.md}
      - {id: schema, name: "Entities: companies, agencies, contacts, roles, applications", owner: lead, status: done, estimate_h: 4, depends: [data-dir], prd: docs/prd/tracker.md, rfc: docs/rfc/stack.md}
      - {id: workflow, name: "Configurable stages, transitions and event history", owner: lead, status: done, estimate_h: 4, depends: [schema], prd: docs/prd/tracker.md, rfc: docs/rfc/stack.md}
      - {id: api, name: "Local JSON API for every action", owner: lead, status: done, estimate_h: 3, depends: [schema], prd: docs/prd/tracker.md, rfc: docs/rfc/stack.md}
      - {id: snapshots, name: "Debounced git auto-commit of the data repo, and push on demand", owner: lead, status: done, estimate_h: 2, depends: [schema], prd: docs/prd/tracker.md, rfc: docs/rfc/stack.md}
      - {id: app-shell, name: "Web app shell: navigation, theming, layout", owner: lead, status: done, estimate_h: 3, depends: [stack-gate], prd: docs/prd/tracker.md, rfc: docs/rfc/stack.md}

  - id: P2
    name: Tracking views
    goal: See and move every application
    tasks:
      - {id: app-list, name: "Applications list with filters and search", owner: lead, status: done, estimate_h: 4, depends: [api, app-shell], prd: docs/prd/tracker.md}
      - {id: board, name: "Board view with allowed-transition drag and drop", owner: lead, status: done, estimate_h: 3, depends: [workflow, app-list], prd: docs/prd/tracker.md}
      - {id: detail-pages, name: "Application, role, company and contact pages with timeline", owner: lead, status: done, estimate_h: 4, depends: [api, app-shell], prd: docs/prd/tracker.md}
      - {id: recruiters, name: "Recruiter and agency pages: contact details, roles, notes", owner: lead, status: done, estimate_h: 2, depends: [detail-pages], prd: docs/prd/tracker.md}
      - {id: dup-warning, name: "Duplicate-submission warning", owner: lead, status: done, estimate_h: 1, depends: [schema], prd: docs/prd/tracker.md}
      - {id: readme-refresh-1, name: "README refresh: tracking views, screenshots with fake data", owner: lead, status: done, estimate_h: 1, depends: [app-list, board, detail-pages, recruiters]}
      - {id: workflow-modes, name: "Stage moves: any stage to any stage by default (history kept, usual next stages hinted); Jira-style configured transitions as an opt-in", owner: lead, status: done, estimate_h: 2, depends: [board], prd: docs/prd/tracker.md}

  - id: P3
    name: Notes, documents and interviews
    goal: Everything about an application in one place
    tasks:
      - {id: notes, name: "Markdown notes on any entity, and general notes", owner: lead, status: done, estimate_h: 3, depends: [detail-pages], prd: docs/prd/tracker.md}
      - {id: links, name: "External links such as Google Docs", owner: lead, status: done, estimate_h: 1, depends: [detail-pages], prd: docs/prd/tracker.md}
      - {id: attachments, name: "File attachments stored in the data directory", owner: lead, status: done, estimate_h: 3, depends: [detail-pages], prd: docs/prd/tracker.md}
      - {id: eml-import, name: "Email export (.eml) parsing into the timeline", owner: lead, status: done, estimate_h: 2, depends: [attachments], prd: docs/prd/tracker.md}
      - {id: documents, name: "Versioned CVs and cover letters, with where each was used", owner: lead, status: done, estimate_h: 2, depends: [attachments], prd: docs/prd/tracker.md}
      - {id: interviews, name: "Interviews and coding tasks: numbered rounds with a description (Round 2 · System design), shown on board and list; schedule, prep, debrief, questions", owner: lead, status: done, estimate_h: 3, depends: [detail-pages], prd: docs/prd/tracker.md}

  - id: P4
    name: Next actions
    goal: Nothing goes quiet unnoticed
    tasks:
      - {id: next-actions, name: "Next actions page: stale applications, upcoming interviews and deadlines", owner: lead, status: done, estimate_h: 4, depends: [workflow, interviews], prd: docs/prd/tracker.md}
      - {id: followups, name: "Follow-up dates, snooze and one-click Ghosted", owner: lead, status: done, estimate_h: 2, depends: [next-actions], prd: docs/prd/tracker.md}
      - {id: readme-refresh-2, name: "README refresh: notes, documents, interviews and Next actions", owner: lead, status: done, estimate_h: 1, depends: [notes, documents, interviews, followups]}

  - id: P5
    name: Insights
    goal: How the search is going
    tasks:
      - {id: sankey, name: "Sankey diagram of stage flows", owner: lead, status: done, estimate_h: 3, depends: [workflow, app-shell], prd: docs/prd/tracker.md}
      - {id: stats, name: "Conversion, time in stage, direct vs recruiter, weekly activity", owner: lead, status: done, estimate_h: 4, depends: [workflow, app-shell], prd: docs/prd/tracker.md}
      - {id: scorecard, name: "Recruiter scorecard", owner: lead, status: done, estimate_h: 2, depends: [stats, recruiters], prd: docs/prd/tracker.md}
      - {id: readme-refresh-3, name: "README and llms.txt refresh: Sankey and insights, demo GIF", owner: lead, status: done, estimate_h: 1, depends: [sankey, stats, scorecard]}

  - id: P6
    name: Extras
    goal: Nice to have once the core works
    tasks:
      - {id: offers, name: "Offer comparison, pay terms, contract day rate and IR35", owner: lead, status: done, estimate_h: 2, depends: [detail-pages], prd: docs/prd/tracker.md}
      - {id: backup-export, name: "One-click backup archive of the data directory", owner: lead, status: done, estimate_h: 2, depends: [data-dir], prd: docs/prd/tracker.md}
      - {id: search, name: "Full-text search across notes and entities", owner: lead, status: done, estimate_h: 3, depends: [notes], prd: docs/prd/tracker.md}
      - {id: readme-refresh-4, name: "README and llms.txt refresh: extras, install guide, v1 release notes", owner: lead, status: done, estimate_h: 1, depends: [offers, backup-export, search]}

  - id: B
    name: Bugs
    goal: Real bugs found in the app, recorded when found and fixed with Kai's go-ahead when they change behaviour
    tasks:
      - {id: fix-applied-date-wipe, type: bug, severity: high, name: "Saving Details after moving to Applied wipes the applied date", detail: "The move fills the date in on the server, but the form keeps its old empty value, so it looks unsaved and Save sends the empty value back. Found by e2e/application-page.spec.ts, whose two test.fail tests come off with the fix.", owner: kai, estimate_h: 1, prd: docs/prd/tracker.md}
      - {id: fix-add-another-role-carries-over, type: bug, severity: medium, name: "Add and add another keeps the type, work mode and IR35 for the next role", detail: "Adding a contract role with Add and add another leaves Type, Work mode and IR35 set, so the next role saves as a contract unless you notice, though the rest of the form clears. Found by e2e/roles.spec.ts, whose test.fail test comes off with the fix.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-duplicate-agency-name, type: bug, severity: medium, name: "New agency and rename allow a second agency with the same name", detail: "Agency names aren't unique, so the New agency dialog quietly makes a second one with the same name, though New application reuses an existing one. A stray double space inside the name also gets offered as a new agency in the person dialog. So does an existing name typed while the list of agencies is still loading, and taking that offer makes a second. Renaming to a taken name does the same. Found by e2e/people.spec.ts and e2e/companies.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-deleted-person-404, type: bug, severity: low, name: "Deleting a person makes a failed request for their page", detail: "After a delete the person page refetches its summary before moving to Recruiters, giving a 404 and a console error. Nothing shows to the user. Found by e2e/people.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-edit-role-list-covers-form, type: bug, severity: low, name: "The role dialog opens with Company's list covering the fields below", detail: "The Add and Edit round dialogs do the same once earlier round names exist, with What is it? covering Type and Format. Company is autofocused, which opens its dropdown over Who told you about it and On which call, until you click elsewhere. Found by e2e/roles.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-cancel-leaves-created-entity, type: bug, severity: low, name: "Cancelling a dialog keeps a company or agency just created inside it", detail: "Choosing + Add creates it straight away, so Cancel or a typo leaves an unused one behind, in both the role and person dialogs. Pinned as today's behaviour in e2e/roles.spec.ts and e2e/people.spec.ts, to change with the fix.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-merge-dialog-after-back, type: bug, severity: low, name: "The Merge dialog stays open after pressing Back", detail: "Open Merge on person A, pick B, then press the browser's Back to B's page: the dialog stays open as From B to B, and Merge gets the refusal that it's the same person. Found by review, reproduced in a browser.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-duplicate-role, type: bug, severity: medium, name: "Add role makes a second role with the same title at the same company", detail: "Pressing Add role and saving the same title at the same company again makes two roles. POST /roles has no dedup and the table has no unique constraint, though New application (POST /applications/quick) reuses a matching role, ignoring case. The fix belongs in the backend, so every caller gets it. Found by e2e/roles.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-double-save-locked, type: bug, severity: medium, name: "Double-clicking Save on a company or agency shows an error though it saved", detail: "A double click can make the Edit dialog send two PATCHes (not every time, so the tests set up the worst case), and when two writes overlap the server answers 500 (database is locked: reproduced with two PATCHes at once on a demo server, so any overlapping writes can hit it). The rename is saved, but the dialog stays open with That didn't work. Found by e2e/companies.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-person-saved-before-new-company, type: bug, severity: medium, name: "Saving a person while their new company or agency is being made loses the link", detail: "Add person stays enabled while + Add is still creating, so on a slow response the person is saved with no company or agency, and the new one is left unused. Found by e2e/companies.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-agency-delete-blocks-application-save, type: bug, severity: medium, name: "An application whose agency was deleted can't be saved", detail: "With no recruiter on it, deleting its agency leaves route agency with neither, and every later edit (Save details, Archived) is refused with 422: An agency application needs an agency or a recruiter. Found by e2e/companies.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-duplicate-company-name, type: bug, severity: medium, name: "New company and rename allow two companies with the same name", detail: "Company names aren't unique, so New company or a rename quietly gives a second one with the same name, and when two share a name, New application by that name makes a third. Found by e2e/companies.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-rename-drops-unsaved-about, type: bug, severity: low, name: "Renaming a company throws away unsaved words in About", detail: "The About box is reset whenever the company's updated_at changes, so text typed but not yet saved vanishes after a rename. Found by e2e/companies.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-website-rules-differ, type: bug, severity: low, name: "New company and Edit disagree on what a website is", detail: "New company and New agency take https://intranet, but the Edit dialog refuses it, so a rename is blocked until the website is changed. Found by e2e/companies.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-new-company-keeps-draft, type: bug, severity: low, name: "The New company dialog keeps what you typed after closing", detail: "Closing it without saving and opening it again shows the old name and website. Found by e2e/companies.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-typed-agency-lost, type: bug, severity: medium, name: "An agency typed but not chosen is dropped without a word", detail: "The fix should keep what was typed or refuse to save, not save without it. The Company box does the same. In the person dialog, typing a new agency and then pressing Add person or Enter, without choosing + Add, saves the person with no agency and no warning. Found by e2e/people.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-emptied-agency-kept, type: bug, severity: medium, name: "Emptying the Agency box keeps the old agency", detail: "The Company box does the same. Editing a person, deleting the agency's name from the box and saving leaves them at that agency, though the box looked empty. The X does take it off. Found by e2e/people.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-stale-edit-after-save, type: bug, severity: medium, name: "Reopening Edit right after saving shows the old values", detail: "The offer dialog does the same (e2e/offers.spec.ts). The person form loads when it opens and doesn't update when the fresh data arrives, so on a slow response it shows the old values, and saving again overwrites the edit. Found by e2e/people.spec.ts with a delayed response.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-new-agency-keeps-draft, type: bug, severity: low, name: "The New agency dialog keeps what you typed after closing", detail: "Closing it without saving and opening it again shows the old name and website. Found by e2e/people.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-merge-nudge-old-linkedin, type: bug, severity: low, name: "Merge says same LinkedIn for two different old-style profiles", detail: "The dialog compares only the first part of a /pub/ address, so two different people with the same name part are suggested as the same person, though the server tells them apart. Found by e2e/people.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-hidden-link-blocks-save, type: bug, severity: medium, name: "A bad link in a field that's been hidden stops the save without a word", detail: "Type a bad link, then change the call to In person or the round away from a coding task: the field goes, its check stays, and pressing save does nothing with no message. Found by e2e/interviews-calls.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-call-delete-no-confirm, type: bug, severity: medium, name: "Deleting a call doesn't ask first", detail: "Delete in a call's menu removes it and its notes straight away, while rounds, people, companies and roles all ask. Found by e2e/interviews-calls.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-company-page-blank-route, type: bug, severity: low, name: "Company page shows no route for an application whose agency was deleted", detail: "With no agency or recruiter left, the row's second line is empty, though the Applications list says Agency. Found by e2e/companies.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-refused-delete-stale-page, type: bug, severity: low, name: "A refused delete leaves the company page out of date", detail: "If an application was added since the page opened, the delete is refused and explained, but the page still says No applications here yet. Documents does the same: Where it was used stays at 0 after a refused delete (e2e/documents.spec.ts). Found by e2e/companies.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-contract-no-rate-hides-ir35, type: bug, severity: low, name: "A contract offer with no day rate yet doesn't show its IR35", detail: "With no rate the card treats it as a salary offer, so IR35 goes unshown though it's saved. Found by e2e/offers.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-offer-no-kind-loses-rate, type: bug, severity: low, name: "Saving an offer that has a day rate but no kind wipes the rate", detail: "It opens as Permanent, so saving sends no day rate. The form always sets a kind, so this is for offers made through the API or an import. Found by e2e/offers.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-offer-kind-before-roles, type: bug, severity: low, name: "Add offer opens as Permanent if the role hasn't loaded yet", detail: "The form takes its kind when it opens, so a contract role starts on the wrong kind when roles are slow. Found by e2e/offers.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-offer-loading-says-none, type: bug, severity: low, name: "An application with an offer says No offer yet while loading", detail: "The card shows the empty text until the offers arrive. Found by e2e/offers.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-offer-plurals, type: bug, severity: low, name: "Offers say 1 months and 1 days", detail: "The offer card and the Offers page always use the plural. Found by e2e/offers.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-person-move-blocks-application, type: bug, severity: medium, name: "Moving a recruiter to another agency makes their applications impossible to edit", detail: "After the person moves agency, or an in-house person joins one, every edit to their existing application is refused with 422, because the route check runs on every save. Found by e2e/people.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-detail-spaces-refused, type: bug, severity: low, name: "A stray space around an email or link gets it refused", detail: "The check runs on the untrimmed text though the save trims it, so a pasted address with a space is called not an email address, and a link with one before it is refused too. Found by e2e/people.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-hidden-link-kept, type: bug, severity: low, name: "A video call changed to in person keeps its join link", detail: "The link field goes but its value is still saved, so a Join link stays, and removing it means switching the call back first. Found by e2e/interviews-calls.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-round-end-before-start, type: bug, severity: low, name: "Moving a round and changing its status together can leave it ending before it starts", detail: "The end only moves with the start when the round is booked and stays booked, so moving a done or cancelled round leaves its end behind too. Found by e2e/interviews-calls.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-didnt-happen-notes-hidden, type: bug, severity: low, name: "What you wrote about a call that didn't happen can't be edited", detail: "Edit shows Agenda for that status, and the notes have no field. Found by e2e/interviews-calls.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-link-rename-tick-error, type: bug, severity: medium, name: "The tick on a link rename shows an error", detail: "Clicking it first takes focus from the box, which saves; then the click saves again. Two PATCHes overlap and one gets a 500 (the same lock as fix-double-save-locked), so That didn't work shows though it saved. Found by e2e/notes-files.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-link-rename-cancel-saves, type: bug, severity: medium, name: "The X on a link rename saves what you typed", detail: "Clicking it takes focus from the box, which saves the change it was meant to cancel. Escape does cancel. Found by e2e/notes-files.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-note-reopen-stale, type: bug, severity: medium, name: "Reopening a note straight after saving shows the old text", detail: "Edit opens from what's cached and the form keeps those words after the refetch; the check for changes elsewhere then passes, so saving puts the old words back. Found by e2e/notes-files.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-file-delete-reason-lost, type: bug, severity: low, name: "A refused file delete doesn't say why", detail: "The server says to delete the version instead, but the page only says Couldn't delete the file. Found by e2e/notes-files.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-orphan-note-link, type: bug, severity: low, name: "A note keeps its link to a company that was deleted", detail: "The note stays attached to nothing, but is left out of General only, where it should count; the picker hides the link so it cannot be taken off. It can still be edited. Found by e2e/notes-files.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-duplicate-document-name, type: bug, severity: low, name: "New document allows a second with the same name", detail: "Document names aren't unique, so a second Backend CV is made without a word. Making a CV file a version of a new CV with a name already there does the same. Found by e2e/documents.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-version-label-repeats, type: bug, severity: low, name: "The suggested version label can repeat one that's there", detail: "It's the count plus one, so after deleting v1 of v1 and v2 it suggests v2 again. Found by e2e/documents.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-deleted-document-404, type: bug, severity: low, name: "Deleting a document with Where it was used open makes a failed request", detail: "The open list refetches the document that's just gone and gets a 404. Found by e2e/documents.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-deleted-application-documents-stale, type: bug, severity: low, name: "Documents doesn't notice an application deleted on its page", detail: "For a few seconds the document still counts as sent and can't be deleted, until the page refreshes. Found by e2e/documents.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-cv-files-stale, type: bug, severity: low, name: "A CV attached on a role's or person's page doesn't show on Documents straight away", detail: "Only uploads on applications refresh the list, so it shows some seconds later. Found by e2e/documents.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-document-usage-stale-after-rename, type: bug, severity: low, name: "Where it was used keeps a company's old name for a few seconds", detail: "Renaming a company doesn't refresh the document's usage list, so reopening it straight away shows the old name. Found by e2e/documents.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-phone-sideways-scroll, type: bug, severity: low, name: "Roles and Companies scroll sideways at phone width", detail: "At 390 pixels the whole page is wider than the screen on these two (55 and 149 pixels with the demo data), though every other page in the menu fits. Found by e2e/shell.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-menu-prefix-active, type: bug, severity: low, name: "The menu marks a section for an address that only starts like it", detail: "On /notes-old, which is Page not found, Notes is marked as where you are. Found by e2e/shell.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-menu-recruiters-section, type: bug, severity: low, name: "A person's or agency's page marks nothing in the menu", detail: "A company's page marks Companies, but /people and /agencies pages mark no section; Recruiters would be the one. Found by e2e/shell.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-backup-same-site, type: bug, severity: low, name: "The backup download only refuses cross-site requests", detail: "The check says another site can't set it off, but a page on another port of this machine counts as same-site and gets the archive started (200). Found by e2e/shell.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-phone-header-overflow, type: bug, severity: low, name: "At phone width the header's contents spill out of it", detail: "At 390 pixels the controls wrap onto a second row, past the 56-pixel header. Found by e2e/shell.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-long-search-misleads, type: bug, severity: low, name: "A very long search says the tracker may not be running", detail: "Over 200 characters the server refuses it with 422, and the page says Search didn't work. Is the tracker running? Found by e2e/timeline-search.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-search-stale-after-rename, type: bug, severity: low, name: "Search results keep a company's old name after a rename", detail: "Renaming doesn't refresh search, so going back to the results shows the old name until they go stale. Found by e2e/timeline-search.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-timeline-load-error-silent, type: bug, severity: medium, name: "A Timeline that can't load says there's nothing here", detail: "A failed request falls through to Nothing here yet and advice to widen the filters, with no sign anything went wrong. Found by e2e/timeline-search.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-search-note-dead-link, type: bug, severity: low, name: "A search hit on a note can lead to a deleted company", detail: "The note keeps its link to the company (fix-orphan-note-link), so the hit opens Couldn't load this company. Found by e2e/timeline-search.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-insights-stale-after-new-application, type: bug, severity: low, name: "Insights doesn't count a new application straight away", detail: "Adding one doesn't refresh Insights, so going back shows the old count until the data goes stale and is fetched again, though the API has the new number. Found by e2e/insights.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-weekly-activity-no-error, type: bug, severity: low, name: "Weekly activity spins for ever if it can't load", detail: "Every other part of Insights says it could not load; this one keeps its loader. Found by e2e/insights.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-event-data-not-dict, type: bug, severity: low, name: "An event whose saved data isn't an object breaks its application's page", detail: "If an event's data column holds JSON null, a list, a string or a number (only possible by hand-editing the database or an export), GET /applications/<id> and /applications/<id>/events return 500, because EventOut requires a dict. POST /activities still returns 201. Found in the review of #168 and confirmed with a throwaway script against main's code (809b6bc); it predates that PR.", owner: lead, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-deletes-no-confirm, type: bug, severity: medium, name: "Some deletes don't ask first", detail: "Kai: all deletes should have a confirmation dialog or modal. Removing a link, a to-do or a document sent from an application happens straight away, while most others ask; calls are fix-call-delete-no-confirm. Found by reading the code after e2e/notes-files.spec.ts; the link test there removes one without answering a question, so it changes with the fix.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md}
      - {id: fix-missing-file-raw-json, type: bug, severity: low, name: "A file missing from the data folder opens raw JSON", detail: "Reproduced in Chrome by a reviewer: attach a PDF, delete it from data/files/, click the link: a new tab shows raw JSON. Not fixed. A file that doesn't open inline shows no JSON: the download is cancelled and the page stays.", owner: lead, status: planned, estimate_h: 1}
