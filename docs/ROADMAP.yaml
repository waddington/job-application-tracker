# job-application-tracker delivery roadmap. The PM dashboard (tools/pm) reads this file.
#
# Strict YAML subset (the dashboard parses it with the standard library only): block mappings
# and lists, one-line scalars, [flow, lists] and one-line {flow: mappings}. No anchors and no
# multi-line strings.
#
# status: bug | planned | building | review | done | blocked
#   A task whose branch (worktree-<id>) or PR exists takes its LIVE status from git and
#   GitHub: building while the branch has commits but no PR, review while the PR is open,
#   done once merged. The status written here is the fallback when there's no live evidence.
# owner: lead (Claude) or kai (waiting on Kai).
# type: bug marks a bug (phase B, with severity: high | medium | low): it starts in the bug status
#   and keeps its BUG tag as a fix moves it along. Every bug found goes here (CLAUDE.md).
# detail: optional longer description, shown under a task's short name.
# estimate_h: agent hours.
# prd / rfc: optional repo-relative paths.

project: job-application-tracker
repo: waddington/job-application-tracker
start: 2026-09-30

phases:
  - id: P0
    name: Foundations
    goal: Planning, a PM dashboard and the stack decision
    tasks:
      - {id: prd-tracker, name: "Product PRD, roadmap and planning docs", owner: lead, status: done, estimate_h: 2, depends: [], prd: docs/prd/tracker.md}
      - {id: pm-dashboard, name: "PM dashboard web app (tools/pm)", owner: lead, status: done, estimate_h: 4, depends: [prd-tracker]}
      - {id: readme, name: "Public README: catchy, search- and LLM-friendly", owner: lead, status: done, estimate_h: 1.5, depends: [prd-tracker]}
      - {id: stack-rfc, name: "Stack and data-format RFC", owner: lead, status: done, estimate_h: 3, depends: [prd-tracker], prd: docs/prd/tracker.md, rfc: docs/rfc/stack.md}
      - {id: stack-gate, name: "Kai signs off the stack RFC", owner: kai, status: done, estimate_h: 0.5, depends: [stack-rfc]}

  - id: P1
    name: Core data and workflow
    goal: Data directory, schema, configurable workflow and a local JSON API
    tasks:
      - {id: data-dir, name: "Configurable data directory, init and backup layout", owner: lead, status: done, estimate_h: 2, depends: [stack-gate], prd: docs/prd/tracker.md, rfc: docs/rfc/stack.md}
      - {id: schema, name: "Entities: companies, agencies, contacts, roles, applications", owner: lead, status: done, estimate_h: 4, depends: [data-dir], prd: docs/prd/tracker.md, rfc: docs/rfc/stack.md}
      - {id: workflow, name: "Configurable stages, transitions and event history", owner: lead, status: done, estimate_h: 4, depends: [schema], prd: docs/prd/tracker.md, rfc: docs/rfc/stack.md}
      - {id: api, name: "Local JSON API for every action", owner: lead, status: done, estimate_h: 3, depends: [schema], prd: docs/prd/tracker.md, rfc: docs/rfc/stack.md}
      - {id: snapshots, name: "Debounced git auto-commit of the data repo, and push on demand", owner: lead, status: done, estimate_h: 2, depends: [schema], prd: docs/prd/tracker.md, rfc: docs/rfc/stack.md}
      - {id: app-shell, name: "Web app shell: navigation, theming, layout", owner: lead, status: done, estimate_h: 3, depends: [stack-gate], prd: docs/prd/tracker.md, rfc: docs/rfc/stack.md}

  - id: P2
    name: Tracking views
    goal: See and move every application
    tasks:
      - {id: app-list, name: "Applications list with filters and search", owner: lead, status: done, estimate_h: 4, depends: [api, app-shell], prd: docs/prd/tracker.md}
      - {id: board, name: "Board view with allowed-transition drag and drop", owner: lead, status: done, estimate_h: 3, depends: [workflow, app-list], prd: docs/prd/tracker.md}
      - {id: detail-pages, name: "Application, role, company and contact pages with timeline", owner: lead, status: done, estimate_h: 4, depends: [api, app-shell], prd: docs/prd/tracker.md}
      - {id: recruiters, name: "Recruiter and agency pages: contact details, roles, notes", owner: lead, status: done, estimate_h: 2, depends: [detail-pages], prd: docs/prd/tracker.md}
      - {id: dup-warning, name: "Duplicate-submission warning", owner: lead, status: done, estimate_h: 1, depends: [schema], prd: docs/prd/tracker.md}
      - {id: readme-refresh-1, name: "README refresh: tracking views, screenshots with fake data", owner: lead, status: done, estimate_h: 1, depends: [app-list, board, detail-pages, recruiters]}
      - {id: workflow-modes, name: "Stage moves: any stage to any stage by default (history kept, usual next stages hinted); Jira-style configured transitions as an opt-in", owner: lead, status: done, estimate_h: 2, depends: [board], prd: docs/prd/tracker.md}

  - id: P3
    name: Notes, documents and interviews
    goal: Everything about an application in one place
    tasks:
      - {id: notes, name: "Markdown notes on any entity, and general notes", owner: lead, status: done, estimate_h: 3, depends: [detail-pages], prd: docs/prd/tracker.md}
      - {id: links, name: "External links such as Google Docs", owner: lead, status: done, estimate_h: 1, depends: [detail-pages], prd: docs/prd/tracker.md}
      - {id: attachments, name: "File attachments stored in the data directory", owner: lead, status: done, estimate_h: 3, depends: [detail-pages], prd: docs/prd/tracker.md}
      - {id: eml-import, name: "Email export (.eml) parsing into the timeline", owner: lead, status: done, estimate_h: 2, depends: [attachments], prd: docs/prd/tracker.md}
      - {id: documents, name: "Versioned CVs and cover letters, with where each was used", owner: lead, status: done, estimate_h: 2, depends: [attachments], prd: docs/prd/tracker.md}
      - {id: interviews, name: "Interviews and coding tasks: numbered rounds with a description (Round 2 · System design), shown on board and list; schedule, prep, debrief, questions", owner: lead, status: done, estimate_h: 3, depends: [detail-pages], prd: docs/prd/tracker.md}

  - id: P4
    name: Next actions
    goal: Nothing goes quiet unnoticed
    tasks:
      - {id: next-actions, name: "Next actions page: stale applications, upcoming interviews and deadlines", owner: lead, status: done, estimate_h: 4, depends: [workflow, interviews], prd: docs/prd/tracker.md}
      - {id: followups, name: "Follow-up dates, snooze and one-click Ghosted", owner: lead, status: done, estimate_h: 2, depends: [next-actions], prd: docs/prd/tracker.md}
      - {id: readme-refresh-2, name: "README refresh: notes, documents, interviews and Next actions", owner: lead, status: done, estimate_h: 1, depends: [notes, documents, interviews, followups]}

  - id: P5
    name: Insights
    goal: How the search is going
    tasks:
      - {id: sankey, name: "Sankey diagram of stage flows", owner: lead, status: done, estimate_h: 3, depends: [workflow, app-shell], prd: docs/prd/tracker.md}
      - {id: stats, name: "Conversion, time in stage, direct vs recruiter, weekly activity", owner: lead, status: done, estimate_h: 4, depends: [workflow, app-shell], prd: docs/prd/tracker.md}
      - {id: scorecard, name: "Recruiter scorecard", owner: lead, status: done, estimate_h: 2, depends: [stats, recruiters], prd: docs/prd/tracker.md}
      - {id: readme-refresh-3, name: "README and llms.txt refresh: Sankey and insights, demo GIF", owner: lead, status: done, estimate_h: 1, depends: [sankey, stats, scorecard]}

  - id: P6
    name: Extras
    goal: Nice to have once the core works
    tasks:
      - {id: offers, name: "Offer comparison, pay terms, contract day rate and IR35", owner: lead, status: done, estimate_h: 2, depends: [detail-pages], prd: docs/prd/tracker.md}
      - {id: backup-export, name: "One-click backup archive of the data directory", owner: lead, status: done, estimate_h: 2, depends: [data-dir], prd: docs/prd/tracker.md}
      - {id: search, name: "Full-text search across notes and entities", owner: lead, status: done, estimate_h: 3, depends: [notes], prd: docs/prd/tracker.md}
      - {id: readme-refresh-4, name: "README and llms.txt refresh: extras, install guide, v1 release notes", owner: lead, status: done, estimate_h: 1, depends: [offers, backup-export, search]}

  - id: B
    name: Bugs
    goal: Real bugs found in the app, recorded when found and fixed with Kai's go-ahead when they change behaviour
    tasks:
      - {id: fix-applied-date-wipe, type: bug, severity: high, name: "Saving Details after moving to Applied wipes the applied date", detail: "The move fills the date in on the server, but the form keeps its old empty value, so it looks unsaved and Save sends the empty value back. Found by e2e/application-page.spec.ts, whose two test.fail tests come off with the fix.", owner: kai, estimate_h: 1, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: loses-or-changes-data, changes_english: false, confirmed_by: code-and-test, severity_reason: "An ordinary flow (move to Applied on the page, then save a tag or follow-up date) silently erases a saved date with no warning, and that date feeds the weekly stats and other views.", ease_reason: "All in one component, DetailsCard, plus removing two test.fail marks; the only decision is how to keep unsaved edits while picking up server changes.", root_cause: "DetailsCard copies the saved values into local state only when it mounts (frontend/src/pages/ApplicationPage.tsx:51) and is keyed by id alone (:304), so when the move fills in the date on the server (src/jat/domain/applications.py:168-169) the form keeps its empty value and shows as dirty (:56). Save then always sends all four fields (:101), and the PATCH treats the explicit null as a clear (src/jat/api/crud.py:17, src/jat/api/routers.py setattr loop in update_app).", fix_outline: "In DetailsCard (frontend/src/pages/ApplicationPage.tsx:48-121), have each field follow the server's value unless the person has edited that field, and make Save send only the fields they actually changed, so a stale value can never overwrite a newer one. Keep unsaved edits across moves, as the comment at :303 requires, take test.fail off both e2e tests, and consider a fast unit test in DetailPages.test.tsx.", pinned_by: "frontend/e2e/application-page.spec.ts:438 and frontend/e2e/application-page.spec.ts:449", related_bugs: [], review_notes: "Traced at main 302ff7b. I read the two test.fail tests but did not run the browser tests, so the failure is confirmed by reading the code, not by watching it happen. No unit test covers this; DetailPages.test.tsx only checks Save is disabled on load and that Archived patches on its own. Worse than the entry says: Save is enabled straight after the move, so the wipe needs no further edit. Clicking Save alone clears the date. If the date is wiped, a later move past Applied refills it with that later day (applications.py:168), so it can end up silently wrong rather than just empty. The original move stays on the timeline, so the date can be found and retyped by hand. Undo is not involved in the wipe: I found no code in the domain undo function that touches applied_on. Same cause, wider reach (reasoned from the code, not tested): the form also goes stale for follow-up, snooze and tags. If those change in another tab, for example via ChaseActions on the Today page, the open page refetches on window focus, keeps the old values, and Save writes them back. The fix outline covers this too. A similar case could arise if the page mounts from cached detail data and a refetch then brings newer values; I did not test that. Workaround until fixed: reload the page after moving to Applied and before saving details. Related but not the same cause, so not listed: fix-stale-edit-after-save (person and offer dialogs load once when opened) and fix-rename-drops-unsaved-about (the opposite failure, resetting on updated_at, which is a reminder not to fix this one by keying on updated_at). I only read their roadmap entries, not their code."}
      - {id: fix-add-another-role-carries-over, type: bug, severity: medium, name: "Add and add another keeps the type, work mode and IR35 for the next role", detail: "Adding a contract role with Add and add another leaves Type, Work mode and IR35 set, so the next role saves as a contract unless you notice, though the rest of the form clears. Found by e2e/roles.spec.ts, whose test.fail test comes off with the fix.", owner: kai, estimate_h: 0.25, prd: docs/prd/tracker.md, ease: trivial, fix_risk: low, data_risk: loses-or-changes-data, changes_english: false, confirmed_by: code-and-test, severity_reason: "The next role can save with the wrong type, work mode and IR35 without any warning, but the values are visible in the form, only that new role is affected, and it can be edited afterwards.", ease_reason: "Three more fields in an existing reset call; the test.fail marker comes off, and no design is needed unless Kai wants these fields kept.", root_cause: "The reset after Add and add another in frontend/src/components/Roles.tsx:195-203 lists the fields to clear but leaves out workMode, employment and ir35, so they stay set for the next role. Its salary and day rate boxes do clear, so the next role saves as a contract with the old IR35 and work mode but no rate (body built at Roles.tsx:171-186).", fix_outline: "Add work mode, type and IR35 to the fields cleared at frontend/src/components/Roles.tsx:195-203, keeping company, person and call as they are. Remove the test.fail marker at frontend/e2e/roles.spec.ts:620 and its KNOWN BUG comment at line 619.", pinned_by: "frontend/e2e/roles.spec.ts:620", related_bugs: [], review_notes: "Confirmed by reading the code and the test.fail test; I did not run the browser tests. The severity is a judgement call: the data_risk value reflects a wrong value on the newly added role only, and no existing saved record is changed. Behaviour decision for Kai: a recruiter pitching several contract roles on one call might find the carry-over handy, but the code comment at Roles.tsx:194 (\"Keep who and which call, clear the rest\") and the test both say clear, so the fix follows that. Company also carries over and an existing test expects it (frontend/e2e/roles.spec.ts:454), so it should stay, even though the comment doesn't mention it. docs/guide/using-the-app.md:48 says the button keeps the person and call; that wording stays true after the fix, though it doesn't mention company either. No shown text has to change. A CLAUDE.md note: this fix changes behaviour, so it needs Kai's go-ahead, and it changes the app, so that PR would normally carry a patch bump."}
      - {id: fix-duplicate-agency-name, type: bug, severity: medium, name: "New agency and rename allow a second agency with the same name", detail: "Agency names aren't unique, so the New agency dialog quietly makes a second one with the same name, though New application reuses an existing one. A stray double space inside the name also gets offered as a new agency in the person dialog. So does an existing name typed while the list of agencies is still loading, and taking that offer makes a second. Renaming to a taken name does the same. Found by e2e/people.spec.ts and e2e/companies.spec.ts.", owner: kai, estimate_h: 3, prd: docs/prd/tracker.md, ease: moderate, fix_risk: medium, data_risk: none, changes_english: true, confirmed_by: code-and-test, severity_reason: "Nothing saved is lost, but a second agency with the same name quietly splits recruiters and applications between two records that look identical, and cleaning up means moving people by hand because agencies have no merge.", ease_reason: "It touches the backend and the shared picker, and needs a decision on refusing versus reusing, plus a new error code and text. Four separate paths lead to the bug.", root_cause: "Nothing checks agency names on the server: the column isn't unique (src/jat/db/models.py:58) and the generic create and update just save (src/jat/api/crud.py:49-71), so New agency and rename both make a twin. Only POST /applications/quick looks for an existing name (src/jat/api/routers.py:693-699, 732), and the person dialog's picker compares the typed text exactly, ignoring only case and outer spaces, against a list that is empty while loading (frontend/src/components/CreatableSelect.tsx:28-30), so a double space or a slow list offers + Add.", fix_outline: "Add one server-side name check for agency create and rename, ignoring case and collapsing repeated spaces, that excludes the agency being renamed; crud.py:63 needs the item id for that, as validate doesn't receive it today. Make CreatableSelect (frontend/src/components/CreatableSelect.tsx:28-30) compare names the same way and not offer + Add until the list has loaded, and show the refusal in the New agency and Edit dialogs.", pinned_by: "frontend/e2e/people.spec.ts:146, frontend/e2e/people.spec.ts:325, frontend/e2e/people.spec.ts:335, frontend/e2e/companies.spec.ts:1203", related_bugs: [fix-duplicate-company-name], review_notes: "I traced this by reading the code and the four test.fail tests; I did not run the browser tests, so the failures themselves are not observed today. Decision for Kai: refuse a taken name, or reuse the existing agency. Rename has to refuse either way, which needs a new error code and new English text. New agency and + Add could reuse silently, but New agency could then drop a website that was typed. A database unique index is risky: existing data folders may already hold duplicates, so it would need a migration that handles them, possibly a major bump. A check in the API avoids that but leaves existing twins in place, and I did not look at real data, so I don't know if any exist. When two agencies already share a name, _by_name (routers.py:699) finds no single match, so New application makes a third. The roadmap records this for companies, and the agency path at routers.py:732 uses the same code. The fix should decide what happens here too. fix-duplicate-company-name shares the same crud path, picker and test pattern, so it is best fixed together. I read its entry and tests, but did not trace it as fully as the agency paths. The recorded 0.5h estimate looks too low. Fix risk: I did not check whether any existing pytest fixtures post the same agency name twice; a refusal would break those. CreatableSelect is also used in Roles.tsx, so a picker change affects that dialog too."}
      - {id: fix-deleted-person-404, type: bug, severity: low, name: "Deleting a person makes a failed request for their page", detail: "After a delete the person page refetches its summary before moving to Recruiters, giving a 404 and a console error. Nothing shows to the user. Found by e2e/people.spec.ts.", owner: kai, estimate_h: 0.25, prd: docs/prd/tracker.md, ease: trivial, fix_risk: low, data_risk: none, changes_english: false, confirmed_by: code, severity_reason: "The delete succeeds and the user lands on Recruiters, so the only effect is a failed background request and a console error, with no data or workflow impact.", ease_reason: "One missing entry in an existing lookup in one file, plus removing the test's allowance for the error.", root_cause: "useDeleteEntity forgets the deleted item's own cached page before refreshing, but its list at frontend/src/api/deleteHooks.ts:35-40 covers application, company, agency and role, not contact. So invalidateApplicationViews (frontend/src/api/hooks.ts:62) refreshes [\"contact-summary\"] while PersonPage (frontend/src/pages/PersonPage.tsx:46) is still mounted, and that request for the deleted person gets a 404.", fix_outline: "Add the contact kind and its [\"contact-summary\", id] key to the own-page list in frontend/src/api/deleteHooks.ts:35-40, as the other kinds already do. Then remove problems.allow(/\\/summary/) at frontend/e2e/people.spec.ts:1074 so that test fails if the 404 comes back.", pinned_by: "frontend/e2e/people.spec.ts:1074", related_bugs: [], review_notes: "I traced this by reading the code and did not run the browser tests, so the 404 was not observed live. people.spec.ts:1074 is not a test.fail: it only allows the /summary error, so it marks the bug but stays green whether or not the bug exists. It starts guarding the fix only once the allowance is removed. The fix copies the approach the code comment describes for the other kinds, but I did not confirm by running that those kinds produce no 404. No text changes are needed. The recorded low severity and the 0.5h estimate are about right, and 0.25h is enough."}
      - {id: fix-edit-role-list-covers-form, type: bug, severity: low, name: "The role dialog opens with Company's list covering the fields below", detail: "The Add and Edit round dialogs do the same once earlier round names exist, with What is it? covering Type and Format. Company is autofocused, which opens its dropdown over Who told you about it and On which call, until you click elsewhere. Found by e2e/roles.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: none, changes_english: false, confirmed_by: code, severity_reason: "It is a one-click annoyance when a dialog opens: the list hides a few fields until you click elsewhere or pick something, and no saved data is touched.", ease_reason: "Mantine already has an openOnFocus prop on Select and Autocomplete, so it is one prop at each autofocused field plus a small test.", root_cause: "The dialogs autofocus a list field (frontend/src/components/Roles.tsx:230 for Company, InterviewFormModal.tsx:147 for What is it?), and Mantine opens the list on any focus because openOnFocus defaults to true (Select.mjs:154, Autocomplete.mjs:100). The list then drops over the fields below it; it stays hidden when empty, which is why the round dialogs only do this once earlier round names exist.", fix_outline: "Turn off open-on-focus on the autofocused fields at Roles.tsx:221 and InterviewFormModal.tsx:142, so focus stays there but the list opens only on click or typing, and do the same at NewApplicationModal.tsx:179 if Kai agrees. Add a test that opening each dialog shows no list and that clicking the field still does.", pinned_by: "none", related_bugs: [], review_notes: "Confirmed by reading the code and Mantine 9.6.3's source only; I did not run a browser. No test pins this: the roadmap says e2e/roles.spec.ts found it, but that spec has no test.fail or assertion for it. Not on the roadmap entry: the New application dialog has the same pattern, with an autofocused Company Autocomplete at NewApplicationModal.tsx:184. From the code, its list should open over what sits below it, though I did not check the on-screen overlap. From a grep and sampling of the specs, the role and application tests click or fill the field before choosing an option, so they should still pass with the fix, but I did not read every spec and did not run them. Alternatively the autofocus could move to a plain text field such as the role title, but that changes where the cursor starts, so it is a choice for Kai. The Edit role dialog uses the same form, so the same cause applies there, and with a company already chosen Mantine shows the full unfiltered list."}
      - {id: fix-cancel-leaves-created-entity, type: bug, severity: low, name: "Cancelling a dialog keeps a company or agency just created inside it", detail: "Choosing + Add creates it straight away, so Cancel or a typo leaves an unused one behind, in both the role and person dialogs. Pinned as today's behaviour in e2e/roles.spec.ts and e2e/people.spec.ts, to change with the fix.", owner: kai, estimate_h: 3, prd: docs/prd/tracker.md, ease: moderate, fix_risk: medium, data_risk: none, changes_english: false, confirmed_by: code-and-test, severity_reason: "Nothing saved is lost or changed; the only effect is a stray, empty company or agency in the lists, which the user can delete from its page or reuse.", ease_reason: "Needs a real decision (hold the new name until Save, or delete on Cancel) across a shared picker and two dialogs, plus rewriting tests that pin today's behaviour; the 0.5h recorded looks too low.", root_cause: "frontend/src/components/CreatableSelect.tsx:42 calls onCreate as soon as + Add is chosen, and the dialogs wire that straight to a POST (frontend/src/components/ContactFormModal.tsx:160 and :171, frontend/src/components/Roles.tsx:227), so the company or agency is saved before the dialog is. Cancel only closes the dialog and nothing undoes the create; picking something else or clearing the box after + Add leaves one behind the same way.", fix_outline: "Preferred: have CreatableSelect hold the typed name as a pending choice and create it only when the dialog's submit runs (ContactFormModal.tsx:111, Roles.tsx submit), keeping it across a failed save so a retry doesn't make a second one. The alternative, deleting on Cancel, is smaller but misses other ways of leaving the dialog and has to be sure nothing else started using the new record.", pinned_by: "frontend/e2e/roles.spec.ts:700; frontend/e2e/people.spec.ts:246; frontend/e2e/people.spec.ts:659", related_bugs: [fix-person-saved-before-new-company, fix-typed-agency-lost, fix-emptied-agency-kept], review_notes: "Browser tests were read, not run. The three pinning tests are ordinary passing tests, not test.fail, so they assert today's behaviour and must be reversed with the fix. Other e2e tests rely on + Add through the addInside helper in frontend/e2e/people.spec.ts and frontend/e2e/companies.spec.ts, and frontend/e2e/people.spec.ts:260 expects + Add to make exactly one and keep the dialog open; I did not read all of them, and some may assert the record exists before Save. Related bugs: I read the roadmap entries and the shared code paths, not their tests. fix-person-saved-before-new-company would largely go away with create-on-Save because there is no in-flight create to race; fix-typed-agency-lost and fix-emptied-agency-kept live in the same picker's typed-text handling, so they are best designed together. The Cancel case is not the only trigger: choosing + Add on a typo and then correcting it also leaves the typo behind, though I found this by reading the code and no test covers it. Deferring also adds a two-step save (create, then save the role or person), so a failure between the steps can still leave one behind; that is much rarer. I did not check whether creating a company or agency adds a timeline entry, though useCreateCompany refreshes the timeline, so a leftover may also show there. The shown text need not change, but moving to create-on-Save changes when the + Add wording is true, so Kai may want to look at it."}
      - {id: fix-merge-dialog-after-back, type: bug, severity: low, name: "The Merge dialog stays open after pressing Back", detail: "Open Merge on person A, pick B, then press the browser's Back to B's page: the dialog stays open as From B to B, and Merge gets the refusal that it's the same person. Found by review, reproduced in a browser.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: loses-or-changes-data, changes_english: false, confirmed_by: code, severity_reason: "It takes an unusual sequence (pressing browser Back with a dialog open onto a person already in the cache), the recorded case ends in a harmless refusal, closing the dialog gets you out, and the rarer case that could merge the wrong pair names both people on screen before you confirm.", ease_reason: "One small change in how the person page is keyed or remounted, plus one browser test; no design decision and no new wording.", root_cause: "The route /people/$personId reuses the same PersonPage when only the id changes (frontend/src/router.tsx:69-73, no remountDeps or key), so the open flag and chosen person in frontend/src/components/MergePerson.tsx:175 and :65 survive Back while the `person` prop becomes B. With B cached, PersonPage.tsx:53 shows no Loader to unmount the dialog, so it reads From B to B (MergePerson.tsx:95,121) and the server refuses with merge_same_person (src/jat/api/routers.py:303-304).", fix_outline: "Tie the dialog state to the person being viewed, by keying the merge components on the person's id in frontend/src/pages/PersonPage.tsx:111 and :121 or by remounting the person route when personId changes (frontend/src/router.tsx:69), so any navigation closes the dialog and clears the choice. Add a browser test in frontend/e2e/people.spec.ts that also covers going Back to a third person.", pinned_by: "none", related_bugs: [], review_notes: "Traced by reading code at main 302ff7b; I did not run the browser and no test pins this bug, so a test should be added with the fix. The roadmap says it was reproduced in a browser. A worse variant is not on the roadmap: visit C, go to A, open Merge, pick B, press Back to C. By my trace the dialog then reads From B to C and the button says Merge into C, and the server has no reason to refuse, so pressing it would merge B into C and delete B. That is why data_risk is set to its worst value, though it needs a deliberate click on a button naming the wrong person. The recorded From B to B case itself changes no data. Not run; worth confirming in the fix's test. It only happens when the page you go Back to is still cached (the normal case for a recently visited page). Otherwise the Loader unmounts the dialog and it disappears. The Merge into this one nudge (MergePerson.tsx:223,272) keeps its state the same way, but it vanishes if the person you land on has no likely duplicates. The Edit dialog (PersonPage.tsx:49,207) also stays open after Back. It reloads the new person's values (ContactFormModal.tsx:109), so it shouldn't write A's values over B, but anything unsaved is lost. Remounting the whole route would fix that too; keying only the merge components would not. fix-merge-nudge-old-linkedin is in the same file but has a different cause, so it isn't listed as related."}
      - {id: fix-duplicate-role, type: bug, severity: medium, name: "Add role makes a second role with the same title at the same company", detail: "Pressing Add role and saving the same title at the same company again makes two roles. POST /roles has no dedup and the table has no unique constraint, though New application (POST /applications/quick) reuses a matching role, ignoring case. The fix belongs in the backend, so every caller gets it. Found by e2e/roles.spec.ts.", owner: kai, estimate_h: 2, prd: docs/prd/tracker.md, ease: moderate, fix_risk: medium, data_risk: none, changes_english: true, confirmed_by: code-and-test, severity_reason: "Nothing is lost and the second role is visible, but one job can end up as two records whose calls and applications split, and New application then picks one of them with no set order; deleting the extra is the workaround unless it already has an application.", ease_reason: "The check itself is small, but Kai must decide between refusing, warning and reusing, and whether the same title can legitimately be two roles. Refusing also needs a new error code and shown text.", root_cause: "POST /roles goes through the generic create at src/jat/api/crud.py:49-57, and _validate_role (src/jat/api/routers.py:47) only checks that linked records exist and handles the decision fields. The Role table (src/jat/db/models.py:95-100) has no unique rule; only quick_create looks for a matching title, ignoring case (src/jat/api/routers.py:717-720).", fix_outline: "Add a same-company, same-title check, ignoring case, to role creation on the backend, ideally sharing the match with quick_create, and have the dialog in frontend/src/components/Roles.tsx:187 show the outcome. Refusal with a coded error looks best, because the test allows it and it keeps what was typed; then turn the test.fail into a normal test and add a backend test.", pinned_by: "frontend/e2e/roles.spec.ts:211", related_bugs: [fix-duplicate-company-name], review_notes: "Confirmed by reading the code and the test.fail; I did not run the browser test or the POST. The roadmap's 0.5h looks low, because this needs a decision first. Decision for Kai: is the same title at one company always the same job? It may not be, for example two openings in different locations, or a role pitched by two recruiters (a role holds only one contact_id). A hard refusal would block those cases; a warning like New application's duplicate check would not, but the test as written expects one role at the end, so a warning would mean changing the test. Avoid three approaches: - Silently returning the existing role would discard the typed pay, location, contact and description, and attach any chosen files to the old role. - A database unique constraint would need a migration that fails or must merge on any duplicates already saved. - Putting the check inside _validate_role is awkward because it also runs on PATCH, with partial data and the role itself as a match. Renaming a role through PATCH can create the same duplicate. The roadmap entry and the test don't cover this, so the fix should decide whether to include it. quick_create's match uses limit(1) with no ordering, so once duplicates exist, which one it picks isn't defined. I only spot-checked backend tests for the same title posted twice at one company (a pattern search of literal calls found none). Helper-built roles and the seeded data could still clash with a new check, so run the full suite. fix-duplicate-company-name is related by its roadmap entry: same kind of missing check, and the same refuse-or-warn decision. I did not trace its code."}
      - {id: fix-double-save-locked, type: bug, severity: medium, name: "Double-clicking Save on a company or agency shows an error though it saved", detail: "A double click can make the Edit dialog send two PATCHes (not every time, so the tests set up the worst case), and when two writes overlap the server answers 500 (database is locked: reproduced with two PATCHes at once on a demo server, so any overlapping writes can hit it). The rename is saved, but the dialog stays open with That didn't work. Found by e2e/companies.spec.ts.", owner: kai, estimate_h: 2.5, prd: docs/prd/tracker.md, ease: moderate, fix_risk: medium, data_risk: blocks-editing, changes_english: false, confirmed_by: code-and-test, severity_reason: "The edit is saved and nothing is corrupted, but overlapping writes give a false error and leave the dialog open; closing it is the workaround, and the same server fault makes the losing write of any overlap fail, visibly.", ease_reason: "A guard on the dialog alone is small, but curing the lock means changing how every request's database transaction starts, which is a real decision with app-wide effect.", root_cause: "Two causes combine. src/jat/db/engine.py:47 starts every transaction with a plain BEGIN and crud.py update_item (src/jat/api/crud.py:60-68) reads before it writes, so if another write commits in between, SQLite refuses at once with \"database is locked\" and busy_timeout (engine.py:42) does not help; nothing maps that error, so it is a 500 (src/jat/api/deps.py:111-113). In the page, EditNameModal (frontend/src/components/EditNameModal.tsx:36) only stops a second submit once the loading state has rendered, and the close callback at CompanyPage.tsx:131 and AgencyPage.tsx:98 belongs to the later mutate call, so the dialog stays open if that call is the one refused.", fix_outline: "In the server, make write requests take the write lock before their first read (or retry on a stale read) in src/jat/db/engine.py and src/jat/api/deps.py, so overlapping writes queue up instead of failing. In EditNameModal.tsx, ignore a second submit while one is in flight, using something that takes effect immediately rather than on next render; then change both test.fail to test and add a backend overlap test.", pinned_by: "frontend/e2e/companies.spec.ts:599 and frontend/e2e/companies.spec.ts:1001 (test.fail; helper doubleSave at :108)", related_bugs: [fix-link-rename-tick-error], review_notes: "Browser tests were not run, so the test.fail cases were read, not watched failing. I did run a throwaway check against the real make_engine in a temp folder with made-up data. Two connections read, one wrote and committed, and the other's write failed in 0.0 s with \"database is locked\". A write with no prior read waited out the other's lock (0.53 s) and succeeded, which is why busy_timeout alone doesn't cover this. That check was at engine level; the HTTP 500 itself I traced in code, and the roadmap entry records reproducing it on a demo server. How often it happens: Mantine disables the Save button while loading (Button.mjs:72), and the tests fire both clicks in one go to force the worst case. A person's double click only gets through if the second click lands before that render, so it should be uncommon, as the test's own comment says. The server fault is wider than this dialog: any request that reads then writes can lose to a write that commits in between, for example two tabs. I did not audit the other write routes. Several, like notes.py:159, commit part way through, so a failure there could leave a partial save; that is unconfirmed. The recorded 0.5 h fits only a dialog guard. That guard would likely pass these tests but leave the lock, and fix-link-rename-tick-error shares the lock but has a different trigger (blur plus click), so I'd fix the two together at the server. A server fix alone may not satisfy the tests as written unless both PATCHes then succeed and the later callback closes the dialog, which looks likely but is untested. The fix should reuse the existing wording, so no English change is expected. Taking the write lock early needs a way to tell write requests from reads, because the engine's begin hook doesn't know the request method; that is the decision for Kai. No files in the repo were changed."}
      - {id: fix-person-saved-before-new-company, type: bug, severity: low, name: "Saving a person while their new company or agency is being made loses the link", detail: "Add person stays enabled while + Add is still creating, so on a slow response the person is saved with no company or agency, and the new one is left unused. Found by e2e/companies.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: loses-or-changes-data, changes_english: false, confirmed_by: code-and-test, severity_reason: "The link is silently missed, but only if you press save during the brief create request, which on a local app is normally milliseconds; the person and the new company both survive and the link can be set again with Edit.", ease_reason: "The dialog already holds both pending flags, so the save button only has to respect them; the two test.fail markers then come off, with a similar small change in the role dialog.", root_cause: "In frontend/src/components/ContactFormModal.tsx:224 the submit button only watches save.isPending, while the create pending flags at :161 and :172 only disable the select box (CreatableSelect.tsx:39). The form value is set only after the create returns (CreatableSelect.tsx:43-46), so a save in that gap sends the old agency_id/company_id (:118-119).", fix_outline: "Treat the dialog as busy while createAgency or createCompany is pending, by extending the loading state of the button at ContactFormModal.tsx:224; Mantine's loading disables the button, which also stops Enter from submitting. Do the same for the role dialog's save buttons (Roles.tsx:365 and :372), then remove test.fail from the two tests.", pinned_by: "frontend/e2e/companies.spec.ts:450 and frontend/e2e/companies.spec.ts:470", related_bugs: [fix-typed-agency-lost], review_notes: "I traced this in the code and read the tests, but did not run the browser tests. The tests use an artificial 1.5s delay; real exposure needs a busy machine or slow disk, so I rated it below the recorded medium. The roadmap entry understates two things. When editing a person who already has a company or agency, a save in the gap keeps the old one rather than leaving it empty, and the same applies to editing a role's company (Roles.tsx:227-228, code reading only, no test). For a new role the company is required, so the save is refused with the required-company error even though a company is being made: misleading, but no wrong data. fix-typed-agency-lost has a different cause (typed search text is never committed to the form) but is in the same dialog and fields, so it is convenient to do alongside. It is not fixed by this change. The fix adds no new text, only the existing spinner on the button."}
      - {id: fix-agency-delete-blocks-application-save, type: bug, severity: medium, name: "An application whose agency was deleted can't be saved", detail: "With no recruiter on it, deleting its agency leaves route agency with neither, and every later edit (Save details, Archived) is refused with 422: An agency application needs an agency or a recruiter. Found by e2e/companies.spec.ts.", owner: kai, estimate_h: 1, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: blocks-editing, changes_english: false, confirmed_by: code-and-test, severity_reason: "Nothing saved is lost and stage moves don't use this check, but after a fairly unusual delete, that application's dates, tags, archive switch, snooze and follow-up all stop saving, with a visible error and no way round in the app.", ease_reason: "One condition in one route handler, plus an API test and removing test.fail from the existing browser tests; no migration or new text.", root_cause: "src/jat/api/routers.py:826 re-runs the whole route check on every application save, even one that only changes tags or dates. Deleting an agency sets agency_id to null (src/jat/db/models.py:129), and with no recruiter the application now fails the rule at routers.py:667-668, a state the delete itself is allowed to create.", fix_outline: "In update_app (src/jat/api/routers.py:826), run the route check only when the save actually changes route, agency or recruiter, so unrelated edits pass. Creating an application, or deliberately setting a bad route, is still refused; add an API test and remove test.fail at frontend/e2e/companies.spec.ts:1128.", pinned_by: "frontend/e2e/companies.spec.ts:1128", related_bugs: [fix-person-move-blocks-application], review_notes: "A throwaway API check with made-up data in a temp folder confirmed it on today's main: tags saved with 200 before the delete, then tags and archived both got 422 agency_route_needs_agency. Browser tests were not run; I only read the test.fail, which targets this exact case. Wider than the entry says: deleting the only recruiter on an agency application with no agency (recruiter_id is also set to null, models.py:130) gave the same 422 in the same check, and so did setting awaiting_reply_since. The Waiting control and Chase actions (snooze, follow-up) use the same save, so from the code they should fail too; I did not run those UI paths. The roadmap entry mentions only the agency case, and I saw no test pinning the recruiter one. No way round in the app: no application screen I found edits route, agency or recruiter. Only PATCHing the API directly with route set to direct returned 200, and that changes the recorded route. fix-person-move-blocks-application comes from the same line (routers.py:826, tests at frontend/e2e/people.spec.ts:1185 and 1205), so the one condition should fix both, though I did not test that case. Its errors come from the other rules in the same check (routers.py:657 and 669). Fix them together. A person-move fix may leave the recruiter and agency disagreeing on old applications, which is a small decision to note. fix-company-page-blank-route is triggered by the same delete but is a separate display problem, so this fix won't cure it. Existing tests only pin that the delete leaves route agency with no agency (tests/test_delete.py, e2e/companies.spec.ts:1101), so keeping that state looks intended."}
      - {id: fix-duplicate-company-name, type: bug, severity: medium, name: "New company and rename allow two companies with the same name", detail: "Company names aren't unique, so New company or a rename quietly gives a second one with the same name, and when two share a name, New application by that name makes a third. Found by e2e/companies.spec.ts.", owner: kai, estimate_h: 2.5, prd: docs/prd/tracker.md, ease: moderate, fix_risk: medium, data_risk: none, changes_english: true, confirmed_by: code-and-test, severity_reason: "Nothing is lost, but a job seeker's roles and applications can quietly split across same-named companies, and companies have no merge; the way round is to move roles by hand or delete the extra company.", ease_reason: "The check itself is small, but it spans the generic CRUD router, quick create, a new error code with English text and tests, and it needs decisions on refusing versus warning and on duplicates already saved.", root_cause: "Nothing checks for a taken name: src/jat/db/models.py:49 has a non-unique name column, and the generic create and update at src/jat/api/crud.py:50 and :60 write whatever they are given. Separately, _by_name at src/jat/api/routers.py:693 returns nothing when two companies match, so quick create at routers.py:711-713 makes a third.", fix_outline: "Add an optional name check to the generic router (crud.py) that refuses a taken name with a 409 and a new coded error, ignoring the company being edited so changing only the case still works. In routers.py, make quick create reuse one existing match when several share the name; add the English text and turn the three test.fail tests into normal tests.", pinned_by: "frontend/e2e/companies.spec.ts:315, frontend/e2e/companies.spec.ts:664, frontend/e2e/companies.spec.ts:1295", related_bugs: [fix-duplicate-agency-name], review_notes: "Traced by reading code at main (302ff7b). I read the three test.fail tests but did not run them or any other test, so \"fails today\" comes from the code trace. Decisions for Kai: 1. Refuse or warn? Two real employers can share a name, and refusing blocks that. The tests accept either, as long as no second company is made (\"a fix may refuse it\"), so a warn-and-allow fix would not pass them as written. 2. Existing duplicates: a database unique constraint would need a migration that fails or has to choose when duplicates are already saved, so an application-level check looks safer. I did not read Kai's data, so I don't know if any exist. 3. Which company does New application reuse when two already share the name? Picking the oldest could attach an application to the wrong one. The picker sends company_id when a company is chosen, so this only affects a name typed but not chosen, or the API. Things to know for the fix: - The check should run in the API, because the inline + Add path in CreatableSelect (frontend/src/components/CreatableSelect.tsx:29) only compares against the list it has loaded. It already keeps the typed text if the create fails. - Matching should use the same lowercase, trimmed comparison as _by_name. SQLite lower() only handles ASCII, so accented names differing by case would not match. POST and PATCH also do not trim names server-side, so a name with stray spaces sent through the API would get past a check that doesn't trim. - normalize_company in src/jat/domain/duplicates.py treats \"Contoso Ltd\" and \"Contoso\" as one for the application warning. An exact-name check would still allow those two, which seems fine but is worth a conscious choice. - The Edit dialog and New company dialog: I saw no onError on the company hooks in the part of detailHooks.ts I read, and did not confirm how a 409 reaches the user. The tests' settled() helper and the \"That didn't work\" notice suggest a global path, but check that the refusal message shows. - crud_router is shared with agencies and roles, so the check should be opt-in. fix-duplicate-agency-name is the same missing check on the same router and is best fixed together, though its entry also covers a double space and a list still loading in the person dialog, which this fix would not fully handle on the frontend. - The roadmap estimate of 0.5h looks low."}
      - {id: fix-rename-drops-unsaved-about, type: bug, severity: low, name: "Renaming a company throws away unsaved words in About", detail: "The About box is reset whenever the company's updated_at changes, so text typed but not yet saved vanishes after a rename. Found by e2e/companies.spec.ts.", owner: kai, estimate_h: 0.25, prd: docs/prd/tracker.md, ease: trivial, fix_risk: low, data_risk: none, changes_english: false, confirmed_by: code-and-test, severity_reason: "It needs an unusual sequence (unsaved About text, then Edit and rename on the same page) and loses only those unsaved words, which the person can see are gone and retype; nothing already saved is touched.", ease_reason: "One line changes the key on the About component in CompanyPage, and an existing test.fail marker comes off; no design, backend or text work.", root_cause: "frontend/src/pages/CompanyPage.tsx:195 keys the About box on company.updated_at, and its text is local state seeded once at CompanyPage.tsx:41. A rename PATCH bumps updated_at (src/jat/db/models.py:44, onupdate) and useUpdateCompany refetches the company summary (frontend/src/api/detailHooks.ts:49-52), so React remounts the box and re-seeds it from the saved description, dropping the typing.", fix_outline: "Change the key at CompanyPage.tsx:195 so it depends on the company's id and its saved description rather than updated_at, so only a real change to About resets the box. Then remove the test.fail marker at frontend/e2e/companies.spec.ts:633 so that test becomes a normal one.", pinned_by: "frontend/e2e/companies.spec.ts:633", related_bugs: [], review_notes: "I traced this through the code at today's main and read the test, but did not run it, since browser tests were off limits. So the test.fail expectation is read, not observed. The key must keep the company id. If it used the description alone, moving directly from one company to another with the same description (often both empty) would keep the box mounted. Unsaved text from the first company would carry over and could be saved to the second. I did not check whether any link goes directly from one company page to another, but browser back and forward could do it, so the id should stay in the key either way. The same loss happens with any other change that bumps the company's updated_at while text is unsaved, such as a website edit in the Edit dialog or a change in another tab followed by a refocus refetch. The timestamps are whole seconds, so a change in the same second as the previous one does not reset the box, which is why the test pauses 1100 ms. With the suggested key, a description changed in another tab would still replace unsaved text; that seems acceptable and rare. CompanyPage.tsx:195 is the only place in frontend/src where a component is keyed on updated_at, so agency and person pages do not share this cause. data_risk is \"none\" because saved data is unaffected; only text that was never saved is lost. There is no unsaved-changes warning anywhere in the frontend (no beforeunload or useBlocker), so this loss comes with no warning. A fix changes what people get, so it needs a patch version bump and changelog entry under the repo's rules. That changelog wording is the only new text, and nothing shown in the app changes."}
      - {id: fix-website-rules-differ, type: bug, severity: low, name: "New company and Edit disagree on what a website is", detail: "New company and New agency take https://intranet, but the Edit dialog refuses it, so a rename is blocked until the website is changed. Found by e2e/companies.spec.ts.", owner: kai, estimate_h: 0.75, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: blocks-editing, changes_english: false, confirmed_by: code-and-test, severity_reason: "It only affects websites with no dot in the host (intranet names, localhost), which are rare for a job search, and it blocks a save with a visible message and loses nothing.", ease_reason: "One check in EditNameModal changes, and one test that currently pins the stricter rule plus the test.fail marker get updated. The only decision is which rule wins, and the server already points to the looser one.", root_cause: "The Edit dialog has its own stricter pattern requiring a dot in the host and no spaces (frontend/src/components/EditNameModal.tsx:29), while New company and New agency only check that the value starts with http:// or https:// (frontend/src/pages/CompaniesPage.tsx:25,35 and frontend/src/pages/RecruitersPage.tsx:55). The server's HttpUrl (src/jat/api/schemas.py:57,64,82,88) accepts https://intranet, so a saved dotless website fails Edit's check even when only the name is being changed.", fix_outline: "Loosen the check at EditNameModal.tsx:29 so it accepts what the server accepts, ideally through one rule shared with the two New dialogs, and leave the server as the final judge. Update the \"real website\" test that lists https://nodot as bad (frontend/e2e/companies.spec.ts:500) and turn the test.fail at companies.spec.ts:643 into a normal test.", pinned_by: "frontend/e2e/companies.spec.ts:643", related_bugs: [], review_notes: "I did not run the browser tests. I confirmed this by reading the code and the test.fail, and by a throwaway pydantic check in a temp folder: the server's rule accepts https://intranet and http://localhost:3000, and refuses https://, \"not a site\" and hosts containing spaces. The passing test at companies.spec.ts:500 deliberately expects Edit to refuse https://nodot. Someone wrote that rule on purpose, so Kai should choose the direction. I recommend loosening Edit, because tightening the New dialogs and the server would leave any dotless website already saved stuck in the same trap. The rules also differ in other ways: Edit trims spaces before checking and New does not, so \" https://x.example.com\" is refused by New and accepted by Edit. New also accepts a space inside the path, which the server encodes, while Edit refuses it. A shared rule should settle these too, but they are minor. The two dialogs show different messages for a bad website: \"Like https://contoso.example.com\" in Edit, \"Links start with http:// or https://\" in New. The fix doesn't have to touch either, so no English changes unless Kai wants them unified. If Edit is loosened only to the http(s) prefix, \"https://\" would reach the server and get its generic refusal notice. That is how New already behaves (companies.spec.ts:296). The workaround today is to change or clear the website in the same Edit dialog, which means giving up the intranet link to rename. Nothing was changed in the repo. My first check via uv run timed out and was moved to the background, so I reran it with the project's existing .venv Python."}
      - {id: fix-new-company-keeps-draft, type: bug, severity: low, name: "The New company dialog keeps what you typed after closing", detail: "Closing it without saving and opening it again shows the old name and website. Found by e2e/companies.spec.ts.", owner: kai, estimate_h: 0.25, prd: docs/prd/tracker.md, ease: trivial, fix_risk: low, data_risk: none, changes_english: false, confirmed_by: code-and-test, severity_reason: "Only leftover unsaved text reappears in a form, in plain view, nothing is saved until the person presses Add company, and the text can simply be overwritten.", ease_reason: "The form needs resetting on close in one component, plus changing the existing test.fail to a normal test.", root_cause: "NewCompanyModal is always mounted (frontend/src/pages/CompaniesPage.tsx:174) and only hides when closed, so its form state (line 31) survives. form.reset() runs only after a successful save (line 46), and closing goes straight to the parent's onClose (line 39) with no reset.", fix_outline: "In frontend/src/pages/CompaniesPage.tsx, clear the form whenever the dialog closes without saving, either by resetting it in the Modal's close handler at line 39 or by only mounting the dialog while it is open at line 174. Then turn the test.fail at frontend/e2e/companies.spec.ts:274 into a normal test.", pinned_by: "frontend/e2e/companies.spec.ts:274", related_bugs: [fix-new-agency-keeps-draft], review_notes: "The browser tests were not run. The conclusion comes from reading the code and the test.fail, which expects the fields to be empty on reopening. fix-new-agency-keeps-draft has the same cause in frontend/src/pages/RecruitersPage.tsx:48-59 and 392, pinned by frontend/e2e/people.spec.ts:159, and is best fixed in the same small change. From the code, a validation message such as the bad-link error should also survive closing, because it is held in the same form state; a reset would clear that too, but the test does not cover it. Not checked in a browser: whether the fields visibly blank during the closing animation if the reset is done in the close handler. It is cosmetic at worst."}
      - {id: fix-typed-agency-lost, type: bug, severity: medium, name: "An agency typed but not chosen is dropped without a word", detail: "The fix should keep what was typed or refuse to save, not save without it. The Company box does the same. In the person dialog, typing a new agency and then pressing Add person or Enter, without choosing + Add, saves the person with no agency and no warning. Found by e2e/people.spec.ts.", owner: kai, estimate_h: 2, prd: docs/prd/tracker.md, ease: moderate, fix_risk: medium, data_risk: loses-or-changes-data, changes_english: true, confirmed_by: code-and-test, severity_reason: "The person saves without the agency or company you just typed and nothing warns you, but no previously saved data is damaged and you can edit the person to add it once you notice.", ease_reason: "The typed text sits inside CreatableSelect and is wiped on blur before the form submits, so the form must be told about it, and Kai must decide between refusing the save and adding the agency automatically.", root_cause: "frontend/src/components/CreatableSelect.tsx:27 keeps the typed text in local state and only reports a value when an option is chosen (:40), so ContactFormModal.tsx:118-119 saves the old agencyId/companyId, usually null. Clicking Add person first blurs the box, and Mantine's Select.mjs:157-161 blanks the text; pressing Enter with no option highlighted just submits the form (use-combobox-target-props).", fix_outline: "Have CreatableSelect tell its parent when the box holds text that doesn't match its chosen value, capturing this before blur clears it, then have ContactFormModal's submit either refuse with a message on the box or add/match the agency or company first. Keep choosing an option and the X working, check the Roles company box, and turn the three test.fail tests into normal tests.", pinned_by: "frontend/e2e/people.spec.ts:281 (also :293 for Enter and :1157 for the Company box)", related_bugs: [fix-emptied-agency-kept], review_notes: "I traced this through the code and read the test.fail tests, but did not run them or any browser tests. The recorded estimate of 0.5h looks low. Same-cause gaps found by reading the code, with no test for them: typing the exact name of an existing agency without choosing it also saves no agency, because the '+ Add' option is not offered and no option is highlighted. When editing a person who already has an agency, typing a different name and saving keeps the old agency, the same cause as fix-emptied-agency-kept, so those two are best fixed together. The Roles dialog (Roles.tsx:221) uses the same box, but its company is required (Roles.tsx:155), so a typed company there gets a validation error instead of being dropped silently; a fix in the shared component must not disturb that. Decision for Kai: refusing the save needs new shown text, which needs his go-ahead. Adding the agency automatically on save needs no new text, but a typo would create a stray agency, and the two-step save has its own failure case. The tests accept either outcome: they only fail if a person is saved with no agency or company."}
      - {id: fix-emptied-agency-kept, type: bug, severity: medium, name: "Emptying the Agency box keeps the old agency", detail: "The Company box does the same. Editing a person, deleting the agency's name from the box and saving leaves them at that agency, though the box looked empty. The X does take it off. Found by e2e/people.spec.ts.", owner: kai, estimate_h: 1, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: blocks-editing, changes_english: false, confirmed_by: code-and-test, severity_reason: "Saving appears to succeed but the person stays linked to the agency or company you tried to remove; nothing is lost, it shows on the person's page afterwards, and the X works as a way round.", ease_reason: "One small change in one shared component, and two test.fail markers to flip, but it needs care around how it interacts with typed text.", root_cause: "frontend/src/components/CreatableSelect.tsx:37-38 only tracks the box's text in local search state, and the form value changes only through onChange at :40, which fires when an option is picked or the X is pressed. Emptying the text therefore leaves agencyId/companyId set, and ContactFormModal.tsx:118-119 sends the old ids on save.", fix_outline: "In CreatableSelect.tsx, when the box is clearable and the user empties the text, also set the value to null, so emptying acts like the X. Limit this to clearable boxes because Roles.tsx:221 uses the same component for a company box with no X. Then turn the two test.fail markers into normal tests.", pinned_by: "frontend/e2e/people.spec.ts:650 (Agency) and frontend/e2e/people.spec.ts:1169 (Company)", related_bugs: [fix-typed-agency-lost], review_notes: "I did not run the browser tests; this comes from reading the code at main and Mantine 9.6.3's Select, plus the two test.fail tests. The X path is covered by a passing-style test at people.spec.ts:639, so the backend already clears the agency when sent null and this looks frontend-only. The roadmap says the box \"looked empty\", which is only true while focus is in it. Mantine's onBlur puts the old name back, so clicking Save or elsewhere refills the box, briefly, as the dialog closes. Pressing Enter in the emptied box probably saves with the box still empty, but I did not read the Combobox key handling far enough to confirm that. data_risk is the nearest option: the requested removal doesn't save and the old link stays, but no saved data is lost or changed. Fix together with fix-typed-agency-lost, as both are the same gap between the box's text and its value in CreatableSelect. If emptying clears the value, then backspacing to empty and typing a new name without choosing + Add would save with no agency. Today that case keeps the old agency, so this fix alone would extend the typed-agency-lost behaviour to edits. Only ContactFormModal (two boxes) and Roles use this component. I did not check whether removing an agency from a person who is on an application hits fix-person-move-blocks-application; the X would already reach that same path."}
      - {id: fix-stale-edit-after-save, type: bug, severity: medium, name: "Reopening Edit right after saving shows the old values", detail: "The offer dialog does the same (e2e/offers.spec.ts). The person form loads when it opens and doesn't update when the fresh data arrives, so on a slow response it shows the old values, and saving again overwrites the edit. Found by e2e/people.spec.ts with a delayed response.", owner: kai, estimate_h: 1, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: loses-or-changes-data, changes_english: false, confirmed_by: code-and-test, severity_reason: "The result is bad, because a second save silently puts the old values back, but it only happens if Edit is reopened in the short gap before the refetch returns, which should be rare on a local server, and the old values are visible in the form. Kept at medium to match fix-note-reopen-stale, the same race.", ease_reason: "One small change in each of two save hooks (make the save wait for the data the Edit dialog reads), and the two existing test.fail tests become normal tests; no schema or text change.", root_cause: "The dialog closes as soon as the save returns, but the refresh is not waited for (useRefreshPeople, frontend/src/api/peopleHooks.ts:9 and :97; useRefreshOffers, frontend/src/api/offerHooks.ts:33 and :60), so Edit can reopen from old cached data. The forms then keep those values: the person form only reloads on open or a change of id (frontend/src/components/ContactFormModal.tsx:103-109), and the offer form takes them once at mount (frontend/src/components/Offers.tsx:105, :132). Neither PATCH has a changed-since check, so saving again writes the old values back.", fix_outline: "Have useSaveContact and useSaveOffer keep the save pending until the queries behind Edit have refetched (or put the saved record straight into the cache), so the dialog only closes once fresh data is there. Then turn the two test.fail tests into normal tests; re-syncing the open form on background refetch is not advised, as it could wipe what someone is typing.", pinned_by: "frontend/e2e/people.spec.ts:688; frontend/e2e/offers.spec.ts:712", related_bugs: [fix-note-reopen-stale], review_notes: "I traced the code and read the tests but did not run the browser tests, so the failures are expected from the code, not observed. Both tests add a 1 second delay to the refetch and only check the reopened form shows the new value; neither does the second save, so the overwrite comes from reading the code (the whole form is sent in the PATCH). I did not measure the real gap on localhost: my low rating assumes it is very short, and a loaded machine or a failed refetch would make it easier to hit; if you weight silent reversion over rarity, medium (the recorded rating) is defensible. Waiting on the refetch means a slow response keeps the dialog open with Save spinning, which is a small behaviour change Kai may want to know about. Wait only on the queries Edit reads, not the whole refresh list. fix-note-reopen-stale is the same kind of race through a different path (Notes.tsx:99-103, NoteEditorModal.tsx:63) and suits the same PR; its test comment already allows for a fix that waits. It has a changed-since check, but per its roadmap entry that passes after the refetch. I did not check whether the role, call or interview forms have the same gap."}
      - {id: fix-new-agency-keeps-draft, type: bug, severity: low, name: "The New agency dialog keeps what you typed after closing", detail: "Closing it without saving and opening it again shows the old name and website. Found by e2e/people.spec.ts.", owner: kai, estimate_h: 0.25, prd: docs/prd/tracker.md, ease: trivial, fix_risk: low, data_risk: none, changes_english: false, confirmed_by: code-and-test, severity_reason: "Only leftover unsaved text reappears in a dialog, it is visible and easy to clear, and nothing is saved unless the person presses Add agency.", ease_reason: "One small change in one component: clear the form when the dialog closes, and turn the existing test.fail into a normal test.", root_cause: "NewAgencyModal is always mounted at frontend/src/pages/RecruitersPage.tsx:392, so its useForm state (line 51) outlives the dialog. form.reset() is only called after a successful save (line 66), and the Modal's onClose (line 59) just hides it.", fix_outline: "In NewAgencyModal (frontend/src/pages/RecruitersPage.tsx:59), make every close (Escape, the X, clicking outside) also reset the form, or reset it on opening as ContactFormModal does, then change frontend/e2e/people.spec.ts:159 from test.fail to test.", pinned_by: "frontend/e2e/people.spec.ts:159", related_bugs: [fix-new-company-keeps-draft], review_notes: "Browser test read but not run, so the failure is from tracing the code and the test.fail marker. Validation errors should linger the same way (not separately tested), and the same reset would clear them. fix-new-company-keeps-draft has the identical pattern in frontend/src/pages/CompaniesPage.tsx:27-47 and its own test.fail at frontend/e2e/companies.spec.ts:273, so fix them together. Decision for Kai: some may like a draft surviving an accidental Escape, but the test and roadmap entry both expect it to clear."}
      - {id: fix-merge-nudge-old-linkedin, type: bug, severity: low, name: "Merge says same LinkedIn for two different old-style profiles", detail: "The dialog compares only the first part of a /pub/ address, so two different people with the same name part are suggested as the same person, though the server tells them apart. Found by e2e/people.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: display-only, changes_english: false, confirmed_by: code-and-test, severity_reason: "Only old /pub/ addresses that share a name part are affected, which is rare; it gives a wrong hint, nothing changes without the person choosing and confirming a merge, and a \"not the same\" button dismisses the nudge.", ease_reason: "One regex and key in one frontend function, plus a small unit test and removing test.fail from the existing e2e test.", root_cause: "identities() in frontend/src/components/MergePerson.tsx:17-18 captures only the first path part after /in/ or /pub/ and stores it under one shared key, so /pub/same-name/1/2/3 and /pub/same-name/4/5/6 look identical. The server's identity() at src/jat/domain/people.py:31-47 keeps the whole /pub/ path and tells them apart.", fix_outline: "Change identities() in frontend/src/components/MergePerson.tsx:17-18 to build the same key as the server: the whole /pub/ path without any trailing slash, with /in/ and /pub/ kept separate. Add a likelyDuplicates case to frontend/src/components/PeopleText.test.tsx and remove test.fail from frontend/e2e/people.spec.ts:1018.", pinned_by: "frontend/e2e/people.spec.ts:1018", related_bugs: [], review_notes: "I did not run the browser test. I read it, and a throwaway check of the same regex on made-up addresses returned \"same-name\" for both /pub/ addresses, so the cause is confirmed. The same function drives two places, the Merge dialog's \"(same LinkedIn)\" label and the yellow \"has the same LinkedIn\" nudge on a person's page. One fix covers both, but the e2e test only checks the dialog. Worst realistic outcome: someone trusts the wrong hint and merges two different people, which deletes one record. The merge still needs a deliberate choice and shows what will happen first, so I rated this display-only. I did not check whether a merge can be undone. The same check showed /in/same-name also gets the key \"same-name\", so an /in/ profile and a /pub/ profile with the same name part are called the same too. That is the same cause and worth fixing together. From reading the code, not run, the frontend also differs from the server in smaller ways: - It doesn't decode %-escapes, so j%C3%B6rg and jörg aren't matched. - It doesn't strip mailto: from emails. - It doesn't check the address starts at the LinkedIn host, or the detail's kind. These are a wider gap than this bug. Matching the server fully would mean a slightly bigger change. The cleanest long-term option is for the server to send the identity keys, but that is more than this bug needs. I checked the other merge and duplicate entries by name in the roadmap. fix-merge-dialog-after-back is a different cause, and fix-detail-spaces-refused is about the save check, so neither is listed as related."}
      - {id: fix-hidden-link-blocks-save, type: bug, severity: medium, name: "A bad link in a field that's been hidden stops the save without a word", detail: "Type a bad link, then change the call to In person or the round away from a coding task: the field goes, its check stays, and pressing save does nothing with no message. Found by e2e/interviews-calls.spec.ts.", owner: kai, estimate_h: 1, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: blocks-editing, changes_english: false, confirmed_by: code-and-test, severity_reason: "Save does nothing and gives no message, which is confusing and blocks the edit, but nothing saved is harmed, the dialog stays open with the typed text, and switching the field back shows the error so it can be corrected.", ease_reason: "Two forms with the same small pattern and existing tests to flip, but the fix must also keep the bad value out of the request, and needs one small choice about what happens to a hidden link.", root_cause: "The link checks in frontend/src/components/Meetings.tsx:111 and InterviewFormModal.tsx:105 (meetingUrl, and taskRepoUrl at :106) run whether or not the field is showing, but the inputs only render conditionally (Meetings.tsx:184, InterviewFormModal.tsx:216). form.onSubmit at Meetings.tsx:116 and InterviewFormModal.tsx:110 then stops on an error attached to a field that isn't on screen, so nothing is visible and no request is sent.", fix_outline: "Make each link check look at the other form values and pass when its field is hidden (in-person call in Meetings.tsx; not a coding task or take-home in InterviewFormModal.tsx), and flip the two test.fail tests to test. Also stop the bad text going out in the save body (Meetings.tsx:124, InterviewFormModal.tsx:126), because the backend types these as HttpUrl (src/jat/api/schemas.py:606, :1230) and would otherwise refuse it with a 422.", pinned_by: "frontend/e2e/interviews-calls.spec.ts:759 (calls); frontend/e2e/interviews-calls.spec.ts:263 (rounds)", related_bugs: [fix-hidden-link-kept], review_notes: "Traced on main at 302ff7b. I read both test.fail tests but did not run the browser tests, and I did not run the 422 path; it is inferred from the schema types. Decision for Kai: dropping every hidden link on save also fixes fix-hidden-link-kept for calls, which wants that behaviour (test at interviews-calls.spec.ts:967). On rounds the same rule would erase a good saved repo link if someone changes the type away from coding task and saves, so a good link there is probably better kept and only a bad one dropped. Do the two call changes together, since both touch the same body line at Meetings.tsx:124. The meeting link field on rounds is always shown, so its check is fine. I only checked these two forms for this pattern, not the other forms with validate rules. The roadmap estimate of 0.5h is slightly low given the body change and the two forms."}
      - {id: fix-call-delete-no-confirm, type: bug, severity: medium, name: "Deleting a call doesn't ask first", detail: "Delete in a call's menu removes it and its notes straight away, while rounds, people, companies and roles all ask. Found by e2e/interviews-calls.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: loses-or-changes-data, changes_english: true, confirmed_by: code-and-test, severity_reason: "One slip in a menu permanently removes a call and its notes from the app with no question or undo, but it takes a deliberate click on a red item and a git snapshot, if set up, may still hold the text.", ease_reason: "One click handler in one component, one new English string, and flipping the existing test.fail to a normal test; the pattern already exists in Interviews.tsx.", root_cause: "The Delete item in the call menu calls the delete mutation directly from its click handler with no confirmation (frontend/src/components/Meetings.tsx:360), and the server hard-deletes the row with its notes straight away (src/jat/api/meetings.py:135-138). Rounds ask first through window.confirm (frontend/src/components/Interviews.tsx:125).", fix_outline: "In MeetingMenu (frontend/src/components/Meetings.tsx:360), ask with window.confirm before deleting, as Interviews.tsx:125 does, using a new deleteConfirm string in frontend/src/locales/en/calls.ts that names the call via callLabel. Then change test.fail to test at frontend/e2e/interviews-calls.spec.ts:937.", pinned_by: "frontend/e2e/interviews-calls.spec.ts:937", related_bugs: [fix-deletes-no-confirm], review_notes: "I read the e2e test but did not run it, so its failure today is inferred from the code and its test.fail marking. Meetings.tsx:360 is the only use of useDeleteMeeting, so there is no second call-delete path to fix. The test at frontend/e2e/interviews-calls.spec.ts:927 already accepts a dialog if one appears, so it should survive the fix; I found no delete test in Meetings.test.tsx or a Delete mention in PersonPage.test.tsx. The new confirm text needs Kai's go-ahead; rounds use \"Delete {{label}}?\", but a call's wording might also mention its notes, and roles added from a call survive its deletion (that same e2e test), so that is worth a thought. Recovery depends on git snapshots being enabled for the data folder; I did not trace the snapshot code or how often it runs. fix-deletes-no-confirm (docs/ROADMAP.yaml:154) names this bug and covers the same missing question on links, to-dos and sent documents, so the two fit well together, though I only read its entry and the to-do remove at Todos.tsx:169."}
      - {id: fix-company-page-blank-route, type: bug, severity: low, name: "Company page shows no route for an application whose agency was deleted", detail: "With no agency or recruiter left, the row's second line is empty, though the Applications list says Agency. Found by e2e/companies.spec.ts.", owner: kai, estimate_h: 0.25, prd: docs/prd/tracker.md, ease: trivial, fix_risk: low, data_risk: display-only, changes_english: false, confirmed_by: code-and-test, severity_reason: "Only after an agency and recruiter are both gone, and it just leaves one dimmed line empty on one page; nothing saved is affected and the application itself still shows the route.", ease_reason: "One expression in one component needs the same fallback the Applications list already uses, and the existing test only needs its test.fail removed.", root_cause: "frontend/src/pages/CompanyPage.tsx:164-167 joins the recruiter and agency names with no fallback, so an agency-route application with neither gets an empty string. Deleting an agency nulls agency_id on the application (src/jat/db/models.py:129) but leaves route as agency; ApplicationsPage.tsx:70-74 already handles this case and shows Agency.", fix_outline: "In CompanyPage.tsx:164-167, fall back to the existing applications:routes.agency string when the joined names are empty, matching the Applications list; ideally share one helper with ApplicationsPage.tsx:70 instead of keeping two copies. Then change the test.fail at frontend/e2e/companies.spec.ts:1259 to a plain test.", pinned_by: "frontend/e2e/companies.spec.ts:1259", related_bugs: [], review_notes: "Traced by reading the code at main (302ff7b); I did not run the browser tests, so the test.fail is read, not seen failing. The fix reuses an existing string (routes.agency, \"Agency\"), so no new wording, though the row gains text it did not show before. Not recorded as separate bugs, and not checked in a browser: the board card (frontend/src/components/Board.tsx:65-70) computes an empty via for the same case, and I did not read how it renders that. The Application drawer (ApplicationDrawer.tsx RouteLine) already handles the case with \"Through an agency\". Deleting a recruiter alone does not trigger this if the agency remains, since the agency name still shows."}
      - {id: fix-refused-delete-stale-page, type: bug, severity: low, name: "A refused delete leaves the company page out of date", detail: "If an application was added since the page opened, the delete is refused and explained, but the page still says No applications here yet. Documents does the same: Where it was used stays at 0 after a refused delete (e2e/documents.spec.ts). Found by e2e/companies.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: none, changes_english: false, confirmed_by: code-and-test, severity_reason: "The server still refuses the delete and explains why, so nothing is lost; the page only stays out of date until the next refetch, and it takes a change made outside this page's cache (another tab or the API) within the short stale window to get there.", ease_reason: "Two error handlers in hooks need to refresh the same queries the success path already refreshes; the two test.fail markers become plain tests.", root_cause: "The delete hooks only refresh on success: frontend/src/api/deleteHooks.ts:59 and frontend/src/api/documentHooks.ts:66 (also :100 for versions) just show the error on a refusal, so the cached company summary or document list stays as it was. The page then keeps its old empty state, and for documents an enabled Delete and Where it was used (0), at frontend/src/pages/DocumentsPage.tsx:230.", fix_outline: "On a failed delete, also refresh the relevant views: in useDeleteEntity's onError (deleteHooks.ts:59) call the application-view invalidation, and in useDeleteDocument and useDeleteVersion (documentHooks.ts:66, :100) run the existing refresh. Then turn both test.fail markers into plain tests; the shown error text stays the same.", pinned_by: "frontend/e2e/companies.spec.ts:1279; frontend/e2e/documents.spec.ts:666", related_bugs: [fix-file-delete-reason-lost, fix-deleted-application-documents-stale], review_notes: "Traced at main 302ff7b by reading the code. I did not run the browser tests, so the test.fail markers are read, not seen failing. Why it is rare: within the app, adding an application already invalidates company-summary, the query staleTime is 10s, and refetchOnWindowFocus is on (App.tsx:22). So it needs a change from another tab, with this one regaining focus inside 10s, or from the API or a script with no focus change; otherwise the page corrects itself. The shared hook means the same gap applies to the agency, person and role delete buttons, and to version delete, though the recorded entry and the tests only cover companies and documents. Company and role refusals are confirmed in src/jat/api/routers.py:75 and :85, document ones in src/jat/api/documents.py:205. Agency and person refusals I did not trace beyond the generic 409 in src/jat/api/crud.py:82. The related bugs are not the same cause: fix-file-delete-reason-lost is the same refused-delete area but about the message, and fix-deleted-application-documents-stale is a missing refresh on the success path of the same hook. Both are cheap to do alongside, not required. I did not read the code of either beyond their roadmap entries and, for the second, the hook's success path, which has no [\"documents\"] key."}
      - {id: fix-contract-no-rate-hides-ir35, type: bug, severity: low, name: "A contract offer with no day rate yet doesn't show its IR35", detail: "With no rate the card treats it as a salary offer, so IR35 goes unshown though it's saved. Found by e2e/offers.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: display-only, changes_english: false, confirmed_by: code-and-test, severity_reason: "Only a display gap on one card for a contract offer with no rate yet: IR35 is saved, still appears in the edit form and on the Offers page, and appears on the card once a rate is added.", ease_reason: "One condition in one frontend function, plus flipping the existing test.fail and adding a small unit case; no backend change or design decision.", root_cause: "offerFacts (frontend/src/components/Offers.tsx:280) uses value_basis to tell a contract from a salary offer, but annual_value (src/jat/domain/offers.py:32) returns no basis for a contract with no day rate. The offer falls into the salary branch at Offers.tsx:282, so the IR35 line at Offers.tsx:281 is skipped.", fix_outline: "In offerFacts (Offers.tsx:280), treat an offer as a contract when its employment_type is contract as well as when its basis is day rate, so a kindless day-rate offer keeps working. Remove the test.fail marker at frontend/e2e/offers.spec.ts:687 and add a no-rate contract case to frontend/src/components/OffersText.test.ts.", pinned_by: "frontend/e2e/offers.spec.ts:687", related_bugs: [], review_notes: "I traced this at today's main (302ff7b) by reading the code; I did not run the browser test, so its test.fail status is read, not observed. The fix reuses the existing \"IR35 outside/inside/unknown\" strings, so no new wording is needed, but CLAUDE.md still requires Kai's go-ahead because it changes what the card shows. The same fix also stops salary-only facts (bonus, pension, equity, holiday) showing on a no-rate contract if the API left them behind; the form clears them on save, so this is unlikely in normal use. The Offers page row (frontend/src/pages/OffersPage.tsx:79) does not check the basis, so it already shows IR35. I read fix-offer-no-kind-loses-rate, which is in the same area, but its cause is different (the form's default kind), so I did not list it as related."}
      - {id: fix-offer-no-kind-loses-rate, type: bug, severity: low, name: "Saving an offer that has a day rate but no kind wipes the rate", detail: "It opens as Permanent, so saving sends no day rate. The form always sets a kind, so this is for offers made through the API or an import. Found by e2e/offers.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: loses-or-changes-data, changes_english: false, confirmed_by: code-and-test, severity_reason: "It silently erases a saved figure, which is serious in kind, but the app's own form always sets a kind, so only an offer created outside the form (API or hand-written data) can reach it.", ease_reason: "One small change to how the edit form picks its starting kind, plus flipping the existing test.fail to a normal test; the rule already exists on the server.", root_cause: "frontend/src/components/Offers.tsx:70 fills a missing kind with the role's kind or Permanent (Offers.tsx:299), and Offers.tsx:123 then sends day_rate null for anything not a contract. The edit form never looks at which figure the offer has, unlike the server's rule in src/jat/domain/offers.py:22-23, so one save erases the rate and also stores Permanent.", fix_outline: "In fromOffer (Offers.tsx:67-70), when an existing offer has no kind, start the form as Contract if it has a day rate and no salary, matching src/jat/domain/offers.py:22-23; otherwise keep the current default. Change the test at offers.spec.ts:699 from test.fail to a normal test.", pinned_by: "frontend/e2e/offers.spec.ts:699", related_bugs: [fix-offer-kind-before-roles], review_notes: "Traced by reading the code at main; I read the test but did not run it, as browser tests were out of scope. Reachability: the schema allows a null kind (src/jat/api/schemas.py:1289, column nullable in migration 0004) and the form always sends one. I found no import path that creates offers in src/jat; src/jat/api/offers.py and scripts/seed_demo.py are the only non-model sources I found, and I did not read seed_demo.py. I did not check Kai's data, so I can't say whether any real offer has no kind. Mirror case not covered by the test or the roadmap entry, from reading only: a no-kind offer with a salary on a contract role opens as Contract through the same line, and saving sends salary, bonus and the other package fields as null. The fix outline leaves this open; the fix should also decide it, for example by starting a no-kind offer with a salary as Permanent. An offer with an explicit kind and leftover figures from another kind also loses them on save, but that looks intended (comment at Offers.tsx:116). fix-offer-kind-before-roles touches the same defaultKind path but has a different cause, so it can be fixed separately. Any fix changes behaviour, so it needs Kai's go-ahead under the repo's bug rule, though no shown text changes."}
      - {id: fix-offer-kind-before-roles, type: bug, severity: low, name: "Add offer opens as Permanent if the role hasn't loaded yet", detail: "The form takes its kind when it opens, so a contract role starts on the wrong kind when roles are slow. Found by e2e/offers.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: display-only, changes_english: false, confirmed_by: code-and-test, severity_reason: "It needs a click on Add offer before the roles list arrives on a local app, usually only on a direct page load, and the wrong kind is shown openly in the form and can be changed with one click.", ease_reason: "One small change in Offers.tsx, and a test.fail already exists to flip; the only decision is between holding the button and updating the open form.", root_cause: "frontend/src/components/Offers.tsx:299 falls back to \"permanent\" while roles are still loading, and Offers.tsx:105-106 reads that default into the form only once, when it mounts, so the role arriving later never changes the kind. Nothing holds the Add button until then: OffersCard renders as soon as the application loads (ApplicationPage.tsx:295, 307).", fix_outline: "In OffersCard (frontend/src/components/Offers.tsx:309-316), hold the Add offer button in a loading state while the roles query is pending, or open the form only once roles have settled. If roles fail to load it must still open as Permanent, so the user is not blocked; then remove test.fail at frontend/e2e/offers.spec.ts:745.", pinned_by: "frontend/e2e/offers.spec.ts:745", related_bugs: [], review_notes: "I did not run the browser test. The confirmation comes from tracing the code and reading the test.fail, which delays /roles by 1.5s and expects the Day rate field within 3s. That timeout means a fix that holds the button or one that updates the open form would both satisfy it. The window is small: roles is a shared query, already cached if the user came from a page that loaded it, so this mostly affects a direct load or refresh of the application page. The form is mounted only on click, so waiting a moment before clicking avoids it entirely. Worst realistic outcome: someone misses the kind control and saves a contract offer as Permanent. Nothing already saved is changed and the offer can be edited, but it would be stored with the wrong kind until then. I rated data_risk display-only on that basis. An alternative fix that resyncs the form when roles arrive must not overwrite a kind the user has already picked, which is why holding the button looks simpler. No shown text needs to change if the existing loading state on Button is used. I checked fix-offer-no-kind-loses-rate because it also lands on the Permanent default (Offers.tsx:70), but it is about existing offers with no kind and the fix here would not solve it, so I did not list it as related. The two could still go in the same PR since they touch the same file."}
      - {id: fix-offer-loading-says-none, type: bug, severity: low, name: "An application with an offer says No offer yet while loading", detail: "The card shows the empty text until the offers arrive. Found by e2e/offers.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: none, changes_english: false, confirmed_by: code-and-test, severity_reason: "The wrong text only shows for the moment the offers take to load on a local app and then corrects itself, with no effect on saved data, though the same branch also shows it if the load fails, which is more misleading but rare.", ease_reason: "One conditional in one component, with the test.fail flipped to a normal test; the only choice is what to show while loading and on a failed load.", root_cause: "frontend/src/components/Offers.tsx:296 takes only `data` from useOffers, and line 318 treats undefined data the same as an empty list, so card.empty (locales/en/offers.ts:75) shows until the offers arrive. Line 315 has the same gap: the button reads as the plain add label rather than the revised one during that time.", fix_outline: "In OffersCard (Offers.tsx:296 and 318), read the query's pending state and show the empty text only once the offers have loaded and the list is really empty, as AtAGlance.tsx:49-51 already does. Showing nothing or an existing loader while pending needs no new text; then change the test.fail at e2e/offers.spec.ts:763 to a normal test.", pinned_by: "frontend/e2e/offers.spec.ts:763", related_bugs: [], review_notes: "I traced this in the code and read the test.fail, but did not run the browser test. The test delays the offers request by 2.5s to make the window visible; on a local server the real flash should be brief, longer on a slow machine. Not in the recorded entry: the card ignores load errors too, so if the offers request fails, line 318 keeps saying \"No offer yet\" for an application that has one, after the query's default retries. That is the more misleading case. Saying \"couldn't load\" would need new or reused wording, so it needs Kai's go-ahead; I did not check whether a reusable string exists in the offers namespace, which has no loading text of its own. No test pins this failure case. fix-offer-kind-before-roles (Offers.tsx:299) is in the same card and has a similar slow-load trigger, but it is a different query and cause, so I have not listed it as related. It could go in the same PR for convenience."}
      - {id: fix-offer-plurals, type: bug, severity: low, name: "Offers say 1 months and 1 days", detail: "The offer card and the Offers page always use the plural. Found by e2e/offers.spec.ts.", owner: kai, estimate_h: 0.25, prd: docs/prd/tracker.md, ease: trivial, fix_risk: low, data_risk: display-only, changes_english: true, confirmed_by: code-and-test, severity_reason: "Only the wording is wrong, and only for a 1-month length or 1 day of holiday, which is rare; the saved figures and comparisons stay correct.", ease_reason: "Three English strings in one catalogue file change; the code already passes count and picks the one form, and an existing test.fail just gets flipped.", root_cause: "The singular catalogue entries repeat the plural: frontend/src/locales/en/offers.ts:29 and :31 (offer card) and :61 and :63 (Offers page). Offers.tsx:286,288 and OffersPage.tsx:77,82 already pass count correctly, so i18next picks the _one form and it says \"1 months\", \"1 days\" or \"1 days' holiday\". A comment at offers.ts:28 records this as deliberately kept.", fix_outline: "In frontend/src/locales/en/offers.ts, give the four _one entries real singular wording, drop the comment at line 28, and turn the test.fail at frontend/e2e/offers.spec.ts:779 into a normal test. Then remove the roadmap entry and add the changelog and version bump the repo expects; docs/rfc/i18n.md:162-164 says \"still says 1 months\" and needs updating too.", pinned_by: "frontend/e2e/offers.spec.ts:779", related_bugs: [], review_notes: "Traced by reading code at main 302ff7b. I read the test.fail but did not run the browser tests, so its failure is inferred from the strings. The catalogue is unambiguous, though. Wording needs Kai's go-ahead. The card's holiday text is possessive, so the singular would be \"1 day's holiday\"; the test regex accepts that. The other three are \"1 month\" on the card and \"1 day\" and \"1 month\" on the page. Only one month's length is affected for contract offers, because holiday is not shown on day-rate offers. A value of 0 uses the plural form and stays correct, though a length of 0 is hidden altogether. Possible separate bug, not on the roadmap as far as I saw: frontend/src/locales/en/insights.ts:197-198 has offer_one and offer_other both as \"{{count}} offer\", which would read \"2 offer\". I only read the string and did not check how it is displayed, so it may be a label where that is intended. It is worth a look if the English is being changed anyway. Other identical _one/_other pairs I saw don't vary in English, except errors.ts \"application(s)\", which is deliberate-looking."}
      - {id: fix-person-move-blocks-application, type: bug, severity: medium, name: "Moving a recruiter to another agency makes their applications impossible to edit", detail: "After the person moves agency, or an in-house person joins one, every edit to their existing application is refused with 422, because the route check runs on every save. Found by e2e/people.spec.ts.", owner: kai, estimate_h: 1, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: blocks-editing, changes_english: false, confirmed_by: code-and-test, severity_reason: "No saved data is lost and stage moves still work, but after an ordinary change to a person, that application's details, archive, follow-up and waiting marks all refuse to save, and the only way round in the app is to temporarily put the person back in their old agency (or take their agency off).", ease_reason: "One small condition in the application PATCH route plus a backend test and removing two test.fail marks; the intended behaviour is already pinned by the e2e tests.", root_cause: "update_app (src/jat/api/routers.py:826) runs _check_route on every PATCH against the merged current values, even when the PATCH doesn't touch the route, agency or recruiter. _check_route (routers.py:657 and :669) reads the recruiter's current agency, so a later person move (update_contact, routers.py:247, which doesn't look at their applications) makes the stored application fail the check with direct_recruiter_has_agency or recruiter_other_agency.", fix_outline: "In update_app (src/jat/api/routers.py:826), run _check_route only when the PATCH actually changes route, agency_id or recruiter_id, comparing values rather than key presence, so real route changes stay validated and the application keeps the agency it was made through (in line with FR8a). Add a backend test next to the route rules in tests/test_error_codes_applications.py and remove the two test.fail marks.", pinned_by: "frontend/e2e/people.spec.ts:1185 and frontend/e2e/people.spec.ts:1204", related_bugs: [fix-agency-delete-blocks-application-save], review_notes: "I did not run the browser tests, so the two test.fail marks were read, not run. I reproduced it on today's main (302ff7b) with a throwaway API script, using made-up data in a temp folder. After the move, PATCHes of tags, archived and follow_up_on each returned 422 recruiter_other_agency, and the in-house case returned 422 direct_recruiter_has_agency. Way round: the API accepts a PATCH that repoints agency_id to the new agency (200) or clears recruiter_id (200), but I found no frontend code that sends agency_id, recruiter_id or route on an existing application, so neither is available in the app. From reading _check_route, moving the person back or taking their agency off should let saves through; I did not run that. The error shown also tells the user something they can't act on on that page. Affected UI saves, from reading the code: Save details and Archived on ApplicationPage, clearing a follow-up on TodayPage, Waiting, and ChaseActions. Stage moves don't call _check_route (it has only three callers, routers.py:684, 784 and 826). My script's own stage-move call returned 422 because I sent the wrong field, so that part rests on the code only. Decision to confirm: with this fix an application can show an agency the recruiter no longer works for. I think that's right as a record of how you applied, but it is a choice. Editing the application's recruiter or agency in the UI would be a separate feature. Related bug: fix-agency-delete-blocks-application-save goes through the same PATCH call and should be fixed by the same condition. I confirmed that by reading the code and did not run that case; it's worth checking when it's fixed, and it is best done in the same change. The recorded estimate of 0.5h is a little low once tests are included."}
      - {id: fix-detail-spaces-refused, type: bug, severity: low, name: "A stray space around an email or link gets it refused", detail: "The check runs on the untrimmed text though the save trims it, so a pasted address with a space is called not an email address, and a link with one before it is refused too. Found by e2e/people.spec.ts.", owner: kai, estimate_h: 0.25, prd: docs/prd/tracker.md, ease: trivial, fix_risk: low, data_risk: blocks-editing, changes_english: false, confirmed_by: code-and-test, severity_reason: "Nothing is lost and the dialog stays open with a visible error, so deleting the stray space gets past it, though the message is a little confusing for an address that looks correct.", ease_reason: "Two checks in one validator need to test the trimmed text, which the save already uses, and the two existing test.fail markers then come off.", root_cause: "In frontend/src/components/ContactFormModal.tsx:94-95 the email and link checks test the raw value, while line 93 and the save at lines 121-122 use the trimmed one. The email pattern at line 32 allows no spaces anywhere, and the link pattern at line 33 must match from the first character, so a space around an email or before a link is refused.", fix_outline: "Make the checks at ContactFormModal.tsx:94-95 test the trimmed value, as the save already does. Then remove test.fail from the two tests in frontend/e2e/people.spec.ts so they guard the fix.", pinned_by: "frontend/e2e/people.spec.ts:1227 and frontend/e2e/people.spec.ts:1237", related_bugs: [], review_notes: "I confirmed this by reading the code and both test.fail tests; I did not run the browser tests. The form is shared, so the bug applies wherever ContactFormModal is used, for both new and edited people. A space after a link is not refused, because the link pattern has no end anchor, and the save trims it. So the roadmap entry is accurate in saying a space before a link is the problem. LinkedIn details go through the same link check, but neither test covers them. The API has no format check on detail values (src/jat/api/schemas.py:102-105), so the block is only in this form. Possibly related but not recorded: the website fields at frontend/src/pages/CompaniesPage.tsx:35 and frontend/src/pages/RecruitersPage.tsx:55, and the role link at frontend/src/components/NewApplicationModal.tsx:85, use the same untrimmed link check. The two website fields also appear to save the value untrimmed (CompaniesPage.tsx:43, RecruitersPage.tsx:63). I read only those lines and did not test them, so this needs checking before it goes on the roadmap. It would be a separate fix and is not part of this bug's tests."}
      - {id: fix-hidden-link-kept, type: bug, severity: low, name: "A video call changed to in person keeps its join link", detail: "The link field goes but its value is still saved, so a Join link stays, and removing it means switching the call back first. Found by e2e/interviews-calls.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md, ease: trivial, fix_risk: low, data_risk: display-only, changes_english: false, confirmed_by: code-and-test, severity_reason: "Nothing is lost: an in-person meeting that is still booked shows a stray Join link, which is a small oddity and can be removed by switching the call back to video and clearing the field.", ease_reason: "One conditional where the save body is built, plus removing test.fail from the existing test; no design needed.", root_cause: "In frontend/src/components/Meetings.tsx:184-196 the link field is only hidden when the kind is in person, but its form value stays, and line 124 always sends it as meeting_url. The row at Meetings.tsx:299 then shows Join link for any scheduled meeting with a URL, whatever its kind.", fix_outline: "In the submit handler at frontend/src/components/Meetings.tsx:124, send no meeting link when the kind is in person, so saving clears it. Then change the test at frontend/e2e/interviews-calls.spec.ts:967 from test.fail to a normal test.", pinned_by: "frontend/e2e/interviews-calls.spec.ts:967", related_bugs: [fix-hidden-link-blocks-save], review_notes: "I read the test and traced the code but did not run the browser tests, so the test.fail result is not observed. fix-hidden-link-blocks-save is in the same form: its validator at Meetings.tsx:111 still checks the hidden field, so the two are best fixed together, though fixing one does not fix the other. Behaviour change to accept: flipping a call to in person and saving will now drop the link for good, so switching back later means pasting it again. That seems right, and it only happens on save. Not checked by running: that the backend clears the stored link when it receives null. The form already sends null when the field is emptied, and the recorded workaround relies on that, but I did not read the update route. Related, not investigated: the reverse switch (in person to video) keeps a hidden location the same way; Meetings.tsx does not display location outside the form, and I did not check other pages. Round forms have no equivalent for the meeting link, because InterviewFormModal.tsx:197 always shows it. They do keep a hidden task_repo_url at line 126 after moving away from a coding task; I did not check whether that gets displayed."}
      - {id: fix-round-end-before-start, type: bug, severity: low, name: "Moving a round and changing its status together can leave it ending before it starts", detail: "The end only moves with the start when the round is booked and stays booked, so moving a done or cancelled round leaves its end behind too. Found by e2e/interviews-calls.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: loses-or-changes-data, changes_english: false, confirmed_by: code-and-test, severity_reason: "The saved end time is wrong, but no page shows a round's end and no form can set one, so it only affects rounds whose end was set through the API, and all it does there is leave an unseen wrong value.", ease_reason: "One small change to a single branch in update_interview, one new backend test, and removing the test.fail marker; no design question beyond the optional validation.", root_cause: "In src/jat/api/interviews.py:166-167 the code that moves the end with the start sits inside the elif at lines 159-163, which only runs when the status did not change and the round is scheduled. A status change (line 152) or an already done or cancelled round skips it, so the old end stays while the start moves. Rounds also have no check that the end is after the start, unlike calls (src/jat/api/meetings.py:73-74).", fix_outline: "In update_interview (src/jat/api/interviews.py:144-169), move the end-follows-start step out of the reschedule branch so it runs whenever an existing start changes and no end was sent, whatever the status. Leave the reschedule count and timeline logic as they are, add a case to tests/test_interviews.py, and remove test.fail at frontend/e2e/interviews-calls.spec.ts:985.", pinned_by: "frontend/e2e/interviews-calls.spec.ts:985", related_bugs: [], review_notes: "I traced the code and read the test, but did not run the browser test or any other test. Round ends have very little reach. The only frontend code that reads one is frontend/src/components/Reschedule.tsx:56, InterviewFormModal has no end field, and nothing under src/jat/domain uses it, so through the app alone a round normally has no end and the bug can't happen. The e2e test sets its end through the API. A wrong end only appears when the start moves later; moving it earlier just makes the round look longer. One knock-on effect: if a bad end exists, the Reschedule modal computes a negative length from it and carries that forward. Existing rows are not repaired by the fix, but that is unlikely to matter. Separate decision for Kai: adding end-before-start validation on rounds, as calls have, is optional. It would change behaviour, and reusing call_ends_before_start would show text that says ends_at and starts_at; the outline above leaves it out and changes no text. The recorded detail on the roadmap is accurate."}
      - {id: fix-didnt-happen-notes-hidden, type: bug, severity: medium, name: "What you wrote about a call that didn't happen can't be edited", detail: "Edit shows Agenda for that status, and the notes have no field. Found by e2e/interviews-calls.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: blocks-editing, changes_english: true, confirmed_by: code-and-test, severity_reason: "Saved notes on a call that didn't happen can't be edited directly and the only way round is hard to discover, but nothing is lost, so it sits at the low end of medium.", ease_reason: "One condition and one extra field in the call form, plus a label, and the existing test.fail becomes a normal test.", root_cause: "The call form treats only status done as having notes: frontend/src/components/Meetings.tsx:114 sets `done`, and lines 209-227 show Agenda otherwise and the notes box only when done. A cancelled call therefore opens with Agenda and no notes field, even though the card shows those notes (line 438) and the Didn't happen dialog wrote them (OutcomeNotes.tsx:162-200).", fix_outline: "In the form at frontend/src/components/Meetings.tsx:209-227, also show the notes box when the status is cancelled, labelled to suit a call that didn't happen rather than \"How did it go?\". Then change the test.fail at frontend/e2e/interviews-calls.spec.ts:1008 to a normal test, and check whether the guide needs a line.", pinned_by: "frontend/e2e/interviews-calls.spec.ts:1008", related_bugs: [], review_notes: "Traced by reading the code at main (302ff7b). I read the test.fail but did not run it or any browser test. The notes are not lost on save: the form keeps them in its values (Meetings.tsx:81) and sends them back (line 127) even while the box is hidden. A workaround follows from that, also from reading only: in Edit, switch Status to Done so the box appears, change the text, switch back to Didn't happen, then save. Wording needs Kai's go-ahead. \"What happened?\" already exists at locales/en/today.ts:154, so reusing it would avoid new wording, but it is still new text on this form. Small decision for the fix: whether Agenda stays visible on a cancelled call. I would keep it, because hiding it would make it uneditable in the same way, though the card does not show agenda for past calls. The same hidden-field pattern affects a call with notes moved back to Scheduled, where the box also hides; I saw this in the code and did not treat it as part of this bug. fix-hidden-link-kept has a similar shape, a hidden field whose value is still saved, but it is a different field and rule, so I did not list it as related. I did not check the interview round edit form for the same problem."}
      - {id: fix-link-rename-tick-error, type: bug, severity: medium, name: "The tick on a link rename shows an error", detail: "Clicking it first takes focus from the box, which saves; then the click saves again. Two PATCHes overlap and one gets a 500 (the same lock as fix-double-save-locked), so That didn't work shows though it saved. Found by e2e/notes-files.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: display-only, changes_english: false, confirmed_by: code-and-test, severity_reason: "The new title is saved and nothing is lost, but the page wrongly says That didn't work and the box can stay open, which misleads; Enter or clicking away avoids it, so it sits at the low end of medium.", ease_reason: "One small change in LinkRow so that pressing the tick doesn't also trigger the save on blur, plus turning the existing test.fail into a normal test.", root_cause: "In frontend/src/components/Links.tsx, the title box saves on blur (line 87) and the tick also saves on click (line 115), and save() has no guard against one already running (lines 66-69), so one click can send two PATCHes. When they overlap, the loser fails with \"database is locked\" because each request reads then writes in a plain BEGIN (src/jat/db/engine.py:47, src/jat/api/links.py:103-115), and SQLite refuses that at once despite the 5-second busy_timeout; notifyError then shows the toast.", fix_outline: "In LinkRow (frontend/src/components/Links.tsx:112-128), stop pressing the tick and X from taking focus from the box, or otherwise make the blur save skip when one of those buttons was pressed, so one click sends one PATCH. Then change the test at notes-files.spec.ts:585 from test.fail to test. The backend lock for overlapping writes is a separate, wider matter under fix-double-save-locked.", pinned_by: "frontend/e2e/notes-files.spec.ts:585", related_bugs: [fix-link-rename-cancel-saves, fix-double-save-locked], review_notes: "I did not run the browser tests; this comes from reading the code and test, plus one throwaway SQLite check in a temp folder. Confirmed: using the app's make_engine, two connections read, one writes and commits, then the other's write fails at once (0.0 s) with \"database is locked\". There is no retry anywhere in the request path. Unconfirmed: how often a real person hits it. The tick shows as loading and becomes disabled while the first save is pending (Mantine sets disabled when loading, ActionIcon.mjs:57). A normal press, with a gap between mouse down and up, may therefore send only one PATCH and show no error. The second save needs mouse up to arrive before React re-renders, as with Playwright's instant click and perhaps with a touch or trackpad tap. The test also holds both PATCHes back so they overlap, which is the worst case. Real-world frequency may be lower than the entry implies. What the person sees depends on which request fails. If the second fails, the box stays open with the toast; only the latest mutate's onSuccess runs, so nothing closes it. If the first fails, the second's success closes the box and the toast still shows. Pressing the tick again should close the box without another PATCH, because the refreshed title then matches, but I traced this rather than ran it. Test weakness: despite its name, the test never checks for the error toast. It only checks that the link shows the new title, both on the page and through the API, so it fails only when the box stays open. If the first PATCH were the one to lose, the test could pass and test.fail would report an unexpected pass, so it may be order-dependent. Adding a check for no toast, or for exactly one PATCH, would make it pin the bug properly. Best fixed together with fix-link-rename-cancel-saves: same blur handler and same two buttons, so one change covers both. That cancel fix alters behaviour, though not shown text, so it needs Kai's go-ahead under the repo's rule; the tick fix only removes a false error. Fixing fix-double-save-locked in the backend alone would remove the error but still send two PATCHes. No change to shown text is needed for this bug."}
      - {id: fix-link-rename-cancel-saves, type: bug, severity: medium, name: "The X on a link rename saves what you typed", detail: "Clicking it takes focus from the box, which saves the change it was meant to cancel. Escape does cancel. Found by e2e/notes-files.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: loses-or-changes-data, changes_english: false, confirmed_by: code-and-test, severity_reason: "Cancel overwrites a link's saved title with the typed text, which is the opposite of what was asked, but only the label changes, the new name is visible, and Escape is a working alternative.", ease_reason: "The change is confined to LinkRow in one component, plus turning the existing test.fail into a normal test; the only care needed is covering mouse and keyboard focus moves.", root_cause: "The title box saves on blur (frontend/src/components/Links.tsx:87, calling save at :66-69), and pressing the X at :124 moves focus out of the box before its click runs. By the time the click closes the editor at :124, the PATCH with the typed title has already been sent.", fix_outline: "In LinkRow in frontend/src/components/Links.tsx, stop the blur handler saving when focus or the press is going to the row's own tick or X buttons, so only those buttons decide what happens. Then change frontend/e2e/notes-files.spec.ts:554 from test.fail to a normal test, and add a check for tabbing to the X if the fix is meant to cover it.", pinned_by: "frontend/e2e/notes-files.spec.ts:554", related_bugs: [fix-link-rename-tick-error], review_notes: "I traced the code and read the test, but did not run the browser test, so the failure itself was not observed today. Fix this together with fix-link-rename-tick-error: the same blur-before-click causes its double save, and one change in the same handler should resolve both. Its test is at frontend/e2e/notes-files.spec.ts:585. Escape stays safe and is pinned by a passing-style test at notes-files.spec.ts:542. Keyboard users have the same problem, from reading the code rather than a test: tabbing from the box to the X blurs it and saves before they can press X. Preventing focus loss on mouse press alone would leave that path broken, so the fix should cover it too. The X is pressed after a save has started, so a slow or failed save can't be undone by it. Links.test.tsx does not cover cancel."}
      - {id: fix-note-reopen-stale, type: bug, severity: medium, name: "Reopening a note straight after saving shows the old text", detail: "Edit opens from what's cached and the form keeps those words after the refetch; the check for changes elsewhere then passes, so saving puts the old words back. Found by e2e/notes-files.spec.ts.", owner: kai, estimate_h: 1.5, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: loses-or-changes-data, changes_english: false, confirmed_by: code-and-test, severity_reason: "The worst case silently overwrites saved note text, but it needs a narrow timing window (or a change made elsewhere while the note is cached or open), and the old words are visible in the form before saving.", ease_reason: "One small area: the note hook and the editor wrapper need a decision on when the form may start from the data, plus unmarking the existing test.fail. The one real choice is what to do if the note changes while the form is open.", root_cause: "NoteEditorModal.tsx:63-66 copies the note into the form once, on mount, from whatever EditExisting (Notes.tsx:99-103) has cached, even if that is out of date (useSaveNote's refresh, noteHooks.ts:30-38, only invalidates and never stores the PATCH reply). The later refetch does not reset the form because the key stays the same, but it does change note.updated_at, which is sent as baseUpdatedAt (NoteEditorModal.tsx:77), so the server's check at src/jat/api/notes.py:174 passes and the old words overwrite the newer ones.", fix_outline: "Pin the conflict timestamp to the version the form was filled from, in NoteEditorModal.tsx:77, so a refetch can't move it. Also stop opening from stale data: in EditExisting (Notes.tsx:99-103) wait for the refetch, and/or have useSaveNote (noteHooks.ts:40-55) store the PATCH reply in the [\"note\", id] cache. Then change the test.fail at notes-files.spec.ts:366 to a normal test; its 3-second hold already allows for a fix that waits.", pinned_by: "frontend/e2e/notes-files.spec.ts:366", related_bugs: [], review_notes: "Traced at main 302ff7b by reading the code; I did not run the browser tests, so the test.fail is read, not seen failing. The recorded scenario is narrow on a local app: the test has to hold the GET open, and normally the refetch window after saving is likely only milliseconds (my estimate, not measured). The same cause has wider routes that the entry and test don't mention, also from reading the code only: 1. Editor open, note changed in another tab, then back to this tab after 10+ seconds: the focus refetch (staleTime 10s, refetchOnWindowFocus, App.tsx:22) moves updated_at under the open form, so saving overwrites the other change with no 409. The existing \"Clash note\" test (notes-files.spec.ts:347) misses this because it fires no focus event and waits only about 1 second. 2. Note cached but not on screen, changed elsewhere, then Edit reopened after the 10-second stale time and before the cache expires (about 5 minutes by the library default): the form shows the old words and the save goes through. Separate gap, not this bug and not on the roadmap as far as I checked: updated_at comes from the note's YAML header (src/jat/storage/notes.py:155), and the file's modified time is only a fallback. The guide (docs/guide/your-data.md:46) invites editing notes in any editor, but an outside edit that leaves the header alone never trips the 409, so this fix would not protect it on its own. Also, the check tolerates differences under 1 second. Worth checking and recording separately. The estimate is higher than the recorded 0.5h because it should include a test for the focus-refetch route. No shown text needs to change unless Kai wants a message when a note changes while open; the existing 409 message would cover that."}
      - {id: fix-file-delete-reason-lost, type: bug, severity: low, name: "A refused file delete doesn't say why", detail: "The server says to delete the version instead, but the page only says Couldn't delete the file. Found by e2e/notes-files.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: none, changes_english: true, confirmed_by: code-and-test, severity_reason: "No data is at risk because the file stays put and the message is only vague, and the normal screens can't currently trigger the version refusal, since version files belong to a document and the Files cards never list those.", ease_reason: "One hook in one file needs to throw the existing API error type, as the rest of the hooks do; the code and its English text already exist, and the test.fail just becomes a normal test.", root_cause: "frontend/src/api/attachmentHooks.ts:94 sees any error from the delete and throws a plain Error with the fixed text Couldn't delete the file, discarding the server's body. The server does send a reason (src/jat/api/attachments.py:218-224, code attachment_is_version_file), and errorText in frontend/src/api/notifyError.ts:8 could show it, but only if it receives an ApiError.", fix_outline: "In attachmentHooks.ts:94, throw an ApiError built from the response's error body, so the toast shows the coded text from frontend/src/locales/en/errors.ts:29 or the server's detail. Then change test.fail to test in notes-files.spec.ts:747, and decide whether errors:own.deleteFile (errors.ts:284, listed in ErrorsText.test.tsx:236) stays as a fallback or goes.", pinned_by: "frontend/e2e/notes-files.spec.ts:747", related_bugs: [], review_notes: "I traced this at main 302ff7b and read the test, but did not run the browser tests. The test forces the 409 with a mocked route on a company file, so it pins the lost message, not a way to reach it in the app. Reachability: I found no route to the real refusal from the normal screens. Both ways of making a version (documents.py:264-266 and 543-546) save the file as an attachment of entity_type document, and the Files cards are only used for agency, contact, company and role, plus one on the application page. I didn't read that application card's props in full. The attachment PATCH route can move a file onto another record, and I found no PATCH call in attachmentHooks.ts, but I didn't search the whole frontend for one. So today this mainly affects other failures, such as a 404 or 500, or a file moved through the API. Shown text: I marked changes_english true because the toast's words change on failure, which needs Kai's go-ahead under the repo rules. No new English needs writing. Other failures change too: a 404 would show the server's not-found message instead of Couldn't delete the file, and a body with no detail would show the generic Something went wrong. Keep the fixed text for failures with no usable reason if Kai prefers it. Similar hooks: meetingHooks.ts:66, offerHooks.ts:70, interviewHooks.ts:89, noteHooks.ts:62 and todoHooks.tsx:130 throw fixed text the same way. I didn't check whether their servers send useful refusals, and none has its own roadmap entry that I found, so I listed no related bugs. The fix can be made on its own and fits Kai's single roadmap PR. The i18n-errors-files task (ROADMAP.yaml:220) deliberately kept this test failing, so that isn't a reason to hold back the fix."}
      - {id: fix-orphan-note-link, type: bug, severity: low, name: "A note keeps its link to a company that was deleted", detail: "The note stays attached to nothing, but is left out of General only, where it should count; the picker hides the link so it cannot be taken off. It can still be edited. Found by e2e/notes-files.spec.ts.", owner: kai, estimate_h: 1.5, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: none, changes_english: false, confirmed_by: code-and-test, severity_reason: "The note and its text are kept, can still be edited and still show under All, so the harm is a wrong General only filter and a dead link that lingers, and only after deleting something the note was on.", ease_reason: "It is a small backend change in one file plus tests; the only decision is to ignore dead links when reading and drop them on save, rather than rewriting note files at delete time.", root_cause: "Note links live in each note's Markdown file, and the delete cleanup at src/jat/db/models.py:372 tidies links, attachments and to-dos but never notes. So src/jat/api/notes.py:133 sees a non-empty list and leaves the note out of General only, and frontend/src/components/NoteEditorModal.tsx:67-69 and :131 hide the unknown link while keeping it on every save, so it cannot be removed.", fix_outline: "In src/jat/api/notes.py, make the entity=none filter at line 133 ignore links whose target no longer exists, checked against ENTITY_MODELS so role and interview links still count, and drop dead links silently in update_note (lines 178-182). Then remove test.fail from the e2e test and add an API test beside test_saving_still_works_when_a_linked_thing_is_gone in tests/test_notes_api.py.", pinned_by: "frontend/e2e/notes-files.spec.ts:442", related_bugs: [], review_notes: "Confirmed at API level with a throwaway pytest run on temp data: after deleting the company, the note still has the company link, entity=none returns nothing, and the unfiltered list still has the note. I did not run the browser tests, so the test.fail and the picker behaviour are read from code only. Things for the fix to watch: - The picker's hiding is deliberate, because it also protects role and interview links it has no option for. The fix should not change that for live links. - Dropped links must not be re-checked as new. An editor opened before the delete still sends the dead link, and _check_links would then refuse the save with a 422 (src/jat/api/notes.py:182). - The 0.5h on the roadmap looks low once tests are counted. Side effect not in the recorded entry, read from code only: src/jat/api/timeline.py:530-531 skips any note with an application link, so a note on a deleted application and a live company likely stays off the whole-picture timeline. Dropping dead links on save would only clear that once the note is saved, so a full fix would need the same liveness check there; I would treat it as optional. Other pages were not fully checked, though search (src/jat/domain/search.py:363) falls back to /notes when a link has no target. I did not compare this against the other fix-* ids."}
      - {id: fix-duplicate-document-name, type: bug, severity: low, name: "New document allows a second with the same name", detail: "Document names aren't unique, so a second Backend CV is made without a word. Making a CV file a version of a new CV with a name already there does the same. Found by e2e/documents.spec.ts.", owner: kai, estimate_h: 2, prd: docs/prd/tracker.md, ease: moderate, fix_risk: low, data_risk: display-only, changes_english: true, confirmed_by: code-and-test, severity_reason: "Nothing saved is lost or overwritten, and the extra entry can be deleted while nothing has been sent with it, but two same-named CVs can be mixed up when choosing what was sent.", ease_reason: "The check is small, but it touches two create paths, a new error code and text, and an existing test, and needs decisions on refuse versus reuse and what counts as the same name.", root_cause: "Nothing checks for a name already in use: the documents table has no unique rule on name (src/jat/db/models.py:273), and both POST /documents (src/jat/api/documents.py:172) and the new-CV branch of adopt (src/jat/api/documents.py:521) insert straight away. The dialogs only check that the name isn't blank (frontend/src/pages/DocumentsPage.tsx:56, frontend/src/components/CvFiles.tsx:54).", fix_outline: "Add a server-side check for a taken name in create_document and the new-CV branch of adopt_cv_file (src/jat/api/documents.py:172 and :521), using a coded error that the dialogs already show through notifyError, plus its English text. Prefer this to a unique index, because existing data may already hold duplicates and an index would need a migration; update tests/test_cv_files.py:208 and remove the two test.fail marks.", pinned_by: "frontend/e2e/documents.spec.ts:198 and frontend/e2e/documents.spec.ts:727", related_bugs: [fix-duplicate-company-name, fix-duplicate-agency-name], review_notes: "Traced by reading the code at main (302ff7b); I did not run the browser tests or any other test, so the two test.fail marks were read, not seen failing. Decisions for Kai: - Refuse or reuse: the first e2e test allows a refusal, a disabled button or a prompt. In adopt, adding the file to the existing document could be friendlier than refusing. - What counts as the same name: whether matching ignores case, and whether it applies per kind. A CV and a cover letter both called \"Backend\" seem legitimate, but the e2e tests only cover the same kind (CV) and the same case. Things that affect the fix: - tests/test_cv_files.py:193 and :208 adopt two files under document_name \"Backend CV\" and expect 201, so that unit test currently relies on duplicates. It must change if adopt refuses; if adopt reuses the existing document, its assertions need rechecking. - The adopt dialog pre-fills the new-CV name with \"CV\" (frontend/src/components/CvFiles.tsx:48), so choosing \"A new CV…\" and accepting the default is an easy way to hit this, and a refusal would be met fairly often there. - PATCH /documents/{id} (src/jat/api/documents.py:188) can also rename onto a taken name. I found no frontend hook that calls it, so this is API-only today and neither the entry nor the tests mention it. - Already-saved duplicates would remain after an app-level check. There is no rename in the UI, and a document that has been sent can't be deleted until it is removed from its applications. - Same-named documents show identically in the sent picker (frontend/src/components/SentDocuments.tsx:25 and :28). Their values are version ids, so I expect them to stay separate records, but I did not run this. Related bugs: the company and agency entries are the same kind of gap and need the same decision, but they go through different code (the generic routes set up in src/jat/api/routers.py), and I read only their roadmap entries and tests, not a trace. They can share an error wording but not one code change. The recorded 0.5h estimate looks low."}
      - {id: fix-version-label-repeats, type: bug, severity: low, name: "The suggested version label can repeat one that's there", detail: "It's the count plus one, so after deleting v1 of v1 and v2 it suggests v2 again. Found by e2e/documents.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: none, changes_english: false, confirmed_by: code-and-test, severity_reason: "It is only a wrong pre-filled suggestion that appears after deleting a version; it is visible and editable, and nothing saved is overwritten, though accepting it leaves two versions with the same label.", ease_reason: "One small change to how the initial label is worked out in AddVersionModal, plus flipping the existing test.fail; the only decision is which rule to use for the next number.", root_cause: "frontend/src/pages/DocumentsPage.tsx:97 builds the suggested label from doc.versions.length + 1, so it counts the versions left rather than looking at their labels. With only v2 left after deleting v1, the count gives v2 again, and neither the API (src/jat/api/documents.py:238) nor the model (src/jat/db/models.py:279) requires labels to be unique, so a repeat saves without complaint.", fix_outline: "In AddVersionModal at DocumentsPage.tsx:97, work out the number from the existing labels so the suggestion can't match one that's there, for example one above the highest vN, keeping the same \"v{{number}}\" text. Then change the test.fail at frontend/e2e/documents.spec.ts:324 to a normal test, and add a case for labels with no number or with a suffix, such as \"v3 (fintech)\".", pinned_by: "frontend/e2e/documents.spec.ts:324", related_bugs: [], review_notes: "I traced this by reading the code and read the test.fail, but did not run the browser tests. It only happens after deleting an unsent version, because sent versions can't be deleted (documents.py:303), and also with hand-typed labels: labels \"v5\" and \"v2\" suggest v3, while \"v3 (fintech)\" alone suggests v2. If a repeat is accepted, the \"sent with\" picker (frontend/src/components/SentDocuments.tsx:28) shows two options that read the same; they stay separate by id, so the risk is only picking the wrong one by mistake. Small decision for the fix: whether \"v2 (fintech)\" counts as v2. Treating it as v2 seems the sensible default, since the guidance text itself uses that style. Existing test to keep passing: documents.spec.ts:224 expects v2 after v1. The en locale's defaultLabel needs no change."}
      - {id: fix-deleted-document-404, type: bug, severity: low, name: "Deleting a document with Where it was used open makes a failed request", detail: "The open list refetches the document that's just gone and gets a 404. Found by e2e/documents.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: none, changes_english: false, confirmed_by: code-and-test, severity_reason: "The delete has already succeeded and the card disappears as it should, so the only effect is one hidden 404 and a browser console error, with nothing shown to the user and no effect on saved data.", ease_reason: "One small change to the delete hook's success step, plus turning the existing test.fail into a normal test.", root_cause: "useDeleteDocument (frontend/src/api/documentHooks.ts:65) uses the shared refresh at documentHooks.ts:39-44, which invalidates the list and every [\"document\", id] query at the same moment. The deleted card's WhereUsed (frontend/src/pages/DocumentsPage.tsx:191, shown at :283) is still mounted until the new list arrives, so its active query refetches the deleted id, and the server's get_or_404 (src/jat/api/documents.py:180) answers 404.", fix_outline: "Give the document delete its own success step in frontend/src/api/documentHooks.ts:65 so the deleted document's query is not refetched: take the document out of the cached list first so its card unmounts, then refresh the rest. Then change frontend/e2e/documents.spec.ts:654 from test.fail to test.", pinned_by: "frontend/e2e/documents.spec.ts:654", related_bugs: [fix-deleted-person-404], review_notes: "I traced this in the code and read the test, but did not run the browser tests, so the test still failing today is inferred from the code. The test fails through the auto-on problems fixture (frontend/e2e/fixtures.ts, which I read), which rejects any response of 400 or above and any console error. The bug only happens with Where it was used open. A closed list has no active query to refetch. An open list on a deletable document is always empty, because the delete button is disabled once a document has been sent (DocumentsPage.tsx:256). React Query's default retry may send a second failing request if the card is still mounted about a second later. I did not check this; it is unlikely, because the list normally returns sooner. Possible trap: copying the removeQueries pattern from frontend/src/api/deleteHooks.ts:41 may not be enough. That code also navigates away first, whereas this card stays mounted until the list updates. A re-render after the removal could rebuild the query and fetch it again. This comes from reasoning about React Query 5.104, not from a run, so whichever fix is used needs the e2e test to prove it. fix-deleted-person-404 is the same kind of bug (a delete refreshes a view that is still mounted) but in different code, useDeleteEntity in deleteHooks.ts. It would not be fixed by this change; it is only worth doing in the same small PR."}
      - {id: fix-deleted-application-documents-stale, type: bug, severity: low, name: "Documents doesn't notice an application deleted on its page", detail: "For a few seconds the document still counts as sent and can't be deleted, until the page refreshes. Found by e2e/documents.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: none, changes_english: false, confirmed_by: code-and-test, severity_reason: "Only a brief out-of-date view: the document still looks sent and its delete buttons stay disabled, no data is at risk, and focusing the window or reopening the page after 10 seconds clears it.", ease_reason: "One small addition to the list of refreshed data in a single hook, and removing test.fail from an existing test.", root_cause: "useDeleteEntity (frontend/src/api/deleteHooks.ts:42-57) refreshes many views after a delete, but neither its list nor invalidateApplicationViews (frontend/src/api/hooks.ts:50-70) includes the \"documents\" or \"document\" queries. With the 10-second staleTime (frontend/src/App.tsx:22), a return to Documents within that window reuses the cached used_in counts, so the buttons at frontend/src/pages/DocumentsPage.tsx:175 and :256 stay disabled.", fix_outline: "Have useDeleteEntity in frontend/src/api/deleteHooks.ts also refresh the \"documents\" and \"document\" queries when an application is deleted, so the sent counts and usage lists update. Then change the test at frontend/e2e/documents.spec.ts:681 from test.fail to a normal test.", pinned_by: "frontend/e2e/documents.spec.ts:681", related_bugs: [fix-document-usage-stale-after-rename], review_notes: "Found by reading the code and the test; I did not run the browser tests, so the test.fail itself was not observed failing today. The server side looks right: application_documents cascades on application delete (src/jat/db/models.py:290) and foreign keys are enforced (src/jat/db/engine.py:40), so this appears to be frontend cache only, though I did not run that delete. The recorded \"for a few seconds, until the page refreshes\" slightly undersells it: useDocuments has no polling, so if you stay on Documents after returning, the old state lasts until a window focus or a remount once the 10 seconds pass. The open document's \"Where it was used\" list goes stale the same way, so the fix should cover [\"document\"] too. The test only checks the delete button; adding a usage-list check would be cheap. Related: fix-document-usage-stale-after-rename has the same missing documents refresh but in useUpdateCompany (frontend/src/api/detailHooks.ts:49-52), and adding the document queries to invalidateApplicationViews would likely fix both at once. It would also refetch documents on every application change, which looks harmless but I did not measure it. Recorded severity (low) and estimate (0.5h) both hold."}
      - {id: fix-cv-files-stale, type: bug, severity: low, name: "A CV attached on a role's or person's page doesn't show on Documents straight away", detail: "Only uploads on applications refresh the list, so it shows some seconds later. Found by e2e/documents.spec.ts.", owner: kai, estimate_h: 0.25, prd: docs/prd/tracker.md, ease: trivial, fix_risk: low, data_risk: none, changes_english: false, confirmed_by: code-and-test, severity_reason: "The file is saved correctly and appears by itself within about 10 seconds or on a reload, so the only harm is a brief moment of doubt about whether the upload registered.", ease_reason: "One condition in one hook needs widening, and the two existing test.fail cases flip to plain tests.", root_cause: "useRefreshFiles at frontend/src/api/attachmentHooks.ts:60-63 refreshes the [\"attachments\", \"cv-files\"] list only when the upload is on an application, yet the backend (src/jat/api/documents.py:378) also counts files on roles and contacts as CV files. After a role or person upload, Documents keeps its cached list until the 10-second staleTime (frontend/src/App.tsx:22) has passed.", fix_outline: "In useRefreshFiles (attachmentHooks.ts:62), also refresh the CV files list for role and contact uploads, matching the three types the backend reads; this covers both useUploadAttachments and useUploadFilesTo. Turn the test.fail at e2e/documents.spec.ts:704 into a plain test, drop its KNOWN BUG comment, and update the \"attached to applications\" comment at documentHooks.ts:135.", pinned_by: "frontend/e2e/documents.spec.ts:704", related_bugs: [], review_notes: "I traced this by reading the code and read the test; I did not run the browser tests. The test.fail loop produces two cases (role and person), and the test's 8-second expect timeout is shorter than the 10-second staleTime, which fits it failing. The same stale list also feeds useCvFilesToSort (frontend/src/components/CvFiles.tsx:285), used by DocumentPerformance, so the same fix should cover that too. A role file added through useUploadFilesTo in Roles.tsx (a new role's job description) takes the same path, though no test covers it. Deleting a file already refreshes every attachment list (attachmentHooks.ts:97), so only uploads are affected. The name is misleading in one way: a file only appears if the backend treats it as a CV (a CV-like name, or the same file in two or more places). fix-document-usage-stale-after-rename and the other stale-list bugs are the same kind of problem but have different causes, so I did not list them as related; I read only their roadmap entries."}
      - {id: fix-document-usage-stale-after-rename, type: bug, severity: low, name: "Where it was used keeps a company's old name for a few seconds", detail: "Renaming a company doesn't refresh the document's usage list, so reopening it straight away shows the old name. Found by e2e/documents.spec.ts.", owner: kai, estimate_h: 0.25, prd: docs/prd/tracker.md, ease: trivial, fix_risk: low, data_risk: display-only, changes_english: false, confirmed_by: code-and-test, severity_reason: "The saved data is right and the old name only shows if the list is reopened within about 10 seconds of the rename, then corrects itself on the next refetch, so it is a brief cosmetic staleness.", ease_reason: "One query key added to an existing shared refresh list, and the test.fail marker removed from the test that already exists.", root_cause: "The usage list reads the [\"document\", id] query (frontend/src/api/documentHooks.ts:30), which is fresh for 10 seconds (frontend/src/App.tsx:22). Renaming a company runs invalidateApplicationViews (frontend/src/api/detailHooks.ts:49-52), whose list at frontend/src/api/hooks.ts:52-67 leaves that key out, so the cached old name is reused; the server always returns the current name (src/jat/api/documents.py:110-132).", fix_outline: "Add the single-document query key to the shared refresh list in frontend/src/api/hooks.ts:52-67, so every change that affects application views also refreshes the usage list. Then change test.fail to test at frontend/e2e/documents.spec.ts:467.", pinned_by: "frontend/e2e/documents.spec.ts:467", related_bugs: [fix-deleted-application-documents-stale, fix-search-stale-after-rename], review_notes: "I traced this by reading the code and the test; I did not run the browser tests. The roadmap's 'a few seconds' is roughly right: the cache stays fresh for 10 seconds, and a reopen after that refetches. The same gap should also affect other changes that go through this helper, such as moving an application (the stage in the usage line), since the key is missing from the list; I read this from the code and no test pins it. Related bugs: fix-deleted-application-documents-stale looks like it has the same kind of gap in the same list, but with the [\"documents\"] key, since the sent count comes from that list; I read deleteHooks.ts:57 only as far as seeing that it calls the helper. fix-search-stale-after-rename has the same missing refresh on rename, because [\"search\"] is not in the list or in useUpdateCompany. All three are best fixed together in this one list. Adding keys only adds refetches for queries currently on screen, so the cost is small. The CV files card also shows company and role names under a separate key ([\"attachments\", \"cv-files\"]), which this list does not refresh either, so it may keep an old name after a rename too; I did not confirm that, and no test pins it."}
      - {id: fix-phone-sideways-scroll, type: bug, severity: low, name: "Roles and Companies scroll sideways at phone width", detail: "At 390 pixels the whole page is wider than the screen on these two (55 and 149 pixels with the demo data), though every other page in the menu fits. Found by e2e/shell.spec.ts.", owner: kai, estimate_h: 1, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: none, changes_english: false, confirmed_by: code-and-test, severity_reason: "Only at phone width, in a local-first app used mainly on a computer, and it costs a sideways drag: no data is affected and everything stays reachable.", ease_reason: "Two small layout changes in two page files, using a pattern other pages already have; the tests already exist and only need their known-failure mark removed. The one small decision is how the Roles view switcher should behave on a phone.", root_cause: "Each page has one wide element with nothing to contain it, so the whole page widens. frontend/src/pages/RolesPage.tsx:52 is a six-option SegmentedControl, which stays on one line and can't shrink. frontend/src/pages/CompaniesPage.tsx:123 is a four-column Table with no scroll wrapper, so unbroken website addresses push it wider; pages such as Applications (ApplicationsPage.tsx:224) wrap theirs.", fix_outline: "In CompaniesPage.tsx:123, put the table in a sideways-scrolling container, as ApplicationsPage.tsx and Scorecard.tsx do, so only the table scrolls. In RolesPage.tsx:52, let the switcher scroll inside its own space or change its layout at phone width, then remove the test.fail at frontend/e2e/shell.spec.ts:313.", pinned_by: "frontend/e2e/shell.spec.ts:313", related_bugs: [fix-phone-header-overflow], review_notes: "Browser tests were not run, so the 55 and 149 pixel figures are the roadmap's, not re-measured. The code matches them, but naming these two elements as the sole causes comes from reading the code, not from measuring; a fix should confirm with the test. The role list itself looks safe because its rows wrap (Roles.tsx:610). A longer translation would widen the Roles switcher further, so the fix should not rely on the English labels fitting. fix-phone-header-overflow has a separate cause (the header row), so it does not share this fix, but it is the same phone-width work and could go in the same PR. Not checked in a browser, and not covered by this test: other tables with no scroll wrapper at InterviewsPage.tsx:73, AgencyPage.tsx:114, PersonPage.tsx:142, CompanyPage.tsx:148 and RolePage.tsx:219. They could overflow in the same way with longer real data, and only Interviews is in the test's menu list. The Recruiters switcher (RecruitersPage.tsx:316) is also five options on one line; the test passes there with the demo data, but it may be close to the limit, especially with a longer language."}
      - {id: fix-menu-prefix-active, type: bug, severity: low, name: "The menu marks a section for an address that only starts like it", detail: "On /notes-old, which is Page not found, Notes is marked as where you are. Found by e2e/shell.spec.ts.", owner: kai, estimate_h: 0.25, prd: docs/prd/tracker.md, ease: trivial, fix_risk: low, data_risk: none, changes_english: false, confirmed_by: code-and-test, severity_reason: "It is only a wrong highlight on a Page not found screen reached by typing an odd address; no saved data or normal work is affected.", ease_reason: "One condition on one line, and the existing test only needs its test.fail marker removed.", root_cause: "frontend/src/components/Layout.tsx:102 marks a menu item active with a bare pathname.startsWith(item.path), so /notes-old counts as under /notes because the match does not stop at a path boundary.", fix_outline: "At frontend/src/components/Layout.tsx:102, treat an item as active only when the address equals its path or continues with a slash after it, keeping the exact match for Today. Then remove test.fail at frontend/e2e/shell.spec.ts:329 so the test pins the fix.", pinned_by: "frontend/e2e/shell.spec.ts:329", related_bugs: [fix-menu-recruiters-section], review_notes: "Traced by reading the code at main (302ff7b); I did not run the browser tests, so the test.fail is read, not observed failing. No real page is affected as far as I can see: the nav paths in frontend/src/nav.ts (/roles, /applications, /recruiters, /companies, /interviews, /offers, /documents, /notes, /insights, /timeline) are not prefixes of the other routes I listed from frontend/src/router.tsx, though that listing was a filtered, truncated grep rather than a full read of the file. fix-menu-recruiters-section computes active state on the same line, so it is best fixed together; I read its test and the line but did not investigate it further."}
      - {id: fix-menu-recruiters-section, type: bug, severity: low, name: "A person's or agency's page marks nothing in the menu", detail: "A company's page marks Companies, but /people and /agencies pages mark no section; Recruiters would be the one. Found by e2e/shell.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: none, changes_english: false, confirmed_by: code-and-test, severity_reason: "It is only a missing highlight in the menu: no data is affected, nothing is blocked, and these pages have their own link back to Recruiters.", ease_reason: "One small change to how Layout decides the active item, or an extra field in nav.ts, and the existing test.fail becomes a normal test.", root_cause: "frontend/src/components/Layout.tsx:102 marks a menu item only when the address starts with that item's path. The routes /people/$personId and /agencies/$agencyId (frontend/src/router.tsx:71,77) don't start with /recruiters, and no other menu item (frontend/src/nav.ts:57) covers them, so nothing is marked.", fix_outline: "Let the Recruiters item in frontend/src/nav.ts:85 also claim the /people and /agencies address prefixes, and have the check at frontend/src/components/Layout.tsx:102 look at those too. Then remove the test.fail at frontend/e2e/shell.spec.ts:336 and its KNOWN BUG comment.", pinned_by: "frontend/e2e/shell.spec.ts:336", related_bugs: [fix-menu-prefix-active], review_notes: "I read the test but did not run it, as browser tests were out of scope; the code trace agrees with it. fix-menu-prefix-active uses the same line (Layout.tsx:102), so fixing both together makes sense: it needs the match to stop at a path boundary, so /notes-old stops marking Notes, and the new prefixes should use the same check. /people pages are treated as Recruiters on the strength of the test and the back link at PersonPage.tsx:67, which goes to /recruiters. I did not check whether a person who is only a company contact should count differently. They would be marked Recruiters too, which matches where that back link already goes."}
      - {id: fix-backup-same-site, type: bug, severity: low, name: "The backup download only refuses cross-site requests", detail: "The check says another site can't set it off, but a page on another port of this machine counts as same-site and gets the archive started (200). Found by e2e/shell.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md, ease: trivial, fix_risk: low, data_risk: none, changes_english: false, confirmed_by: code-and-test, severity_reason: "Nothing saved is lost or changed and the other page can't read the zip (no CORS outside dev mode); the worst case is needless work, a temporary file and possibly an unexpected download, and only if a page on another port of this machine targets it.", ease_reason: "One condition in one route, plus removing test.fail and adding a unit test case; no design decision beyond treating same-site as refused.", root_cause: "src/jat/api/backup.py:86 refuses only the exact Sec-Fetch-Site value \"cross-site\". Browsers ignore the port when deciding what counts as the same site, so a page on another port of 127.0.0.1 sends \"same-site\", passes the check and starts the export and zip. The LocalOnly middleware (src/jat/security.py:60) only guards POST, PUT, PATCH and DELETE, so it doesn't cover this GET.", fix_outline: "Widen the check at src/jat/api/backup.py:86 to refuse \"same-site\" as well, while still allowing same-origin, none (a typed address) and a missing header (curl and scripts). Update the route's docstring, which means regenerating frontend/openapi.json and schema.d.ts, then remove test.fail at frontend/e2e/shell.spec.ts:352 and add a same-site case to tests/test_archive.py:69.", pinned_by: "frontend/e2e/shell.spec.ts:352", related_bugs: [], review_notes: "Traced by reading the code at main 302ff7b; I did not run the browser test or any test. The e2e test sets the header by hand through Playwright's request client, so it pins the server's response but not what a real browser sends; that a browser sends \"same-site\" across ports comes from the Fetch Metadata rules, not something I observed here. The sidebar's backup link (frontend/src/components/Layout.tsx:115) is a relative link. It is same-origin in production and also through the Vite proxy on :5173, so refusing same-site should not break it. Anyone clicking a link to the tracker from another local app on a different port would now get the 403, which seems to be the intended behaviour. No shown text has to change: the existing message, \"Backups can only be downloaded from the tracker itself.\", is already right, and tests/test_error_codes.py:160 still holds. The docstring edit does change API-docs wording (the OpenAPI description), though not anything in the app's UI, so a code-only fix could skip it, but then the docstring would be less accurate. The fix needs a patch version bump. It is safe to bundle with the other roadmap changes, though it is a code change, so the full local checks apply. I searched the roadmap for other fix-* bugs about backup, cross-site or origin handling and found none with this cause."}
      - {id: fix-phone-header-overflow, type: bug, severity: low, name: "At phone width the header's contents spill out of it", detail: "At 390 pixels the controls wrap onto a second row, past the 56-pixel header. Found by e2e/shell.spec.ts.", owner: kai, estimate_h: 1, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: none, changes_english: false, confirmed_by: code-and-test, severity_reason: "Cosmetic and phone-only: every control still works and no data is touched, though the second row covers roughly the top 8 pixels of the page content.", ease_reason: "Only a few props across the header components need to change, but there is a small choice about how to free about 80 pixels, and the search box must stay usable.", root_cause: "The outer header row (frontend/src/components/Layout.tsx:54) can wrap, and its contents don't fit at 390 pixels: about 60 for burger and logo, 16 gap and 362 for the controls (Layout.tsx:72, with the search box fixed at 160 at HeaderSearch.tsx:42), against 358 available. The controls drop to a second row ending about 80 pixels down, in a header fixed at 56.", fix_outline: "Stop the outer row wrapping in Layout.tsx and free about 80 pixels at phone width, by tightening header gaps and padding, shrinking the search box and dropping its \"/\" hint, and removing the language button's empty arrow space in HeaderButtons.tsx. Then remove the test.fail at e2e/shell.spec.ts:363, and also check a narrower phone such as 360 pixels.", pinned_by: "frontend/e2e/shell.spec.ts:363", related_bugs: [], review_notes: "Browser tests were not run. The test.fail is still in place, and the pixel figures are my arithmetic from Mantine's CSS values, so they are estimates. At 390 pixels the test's bottom check should be what fails; the right edge of the controls works out at about 378, inside the screen. The earlier language switch fix (332a59a) shortened the button but did not cure this, so the comment at HeaderButtons.tsx:124 saying the header \"only just fits\" is misleading. Worth correcting in the fix. Decision for Kai: squeezing leaves a search box of about 130 pixels at 390, and much less at 320, where it stops being useful. The alternative is folding search behind an icon, which is more work and would mean changing the \"search works from the header\" phone test (shell.spec.ts:299 area), since it expects the box to be visible. I checked fix-phone-sideways-scroll and did not list it as related. It only affects Roles and Companies, so it looks like page content, not the header, though I did not trace its cause. It could still go in the same PR, as it is also a phone layout fix."}
      - {id: fix-long-search-misleads, type: bug, severity: low, name: "A very long search says the tracker may not be running", detail: "Over 200 characters the server refuses it with 422, and the page says Search didn't work. Is the tracker running? Found by e2e/timeline-search.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: none, changes_english: true, confirmed_by: code-and-test, severity_reason: "The message is misleading, but it only appears for a search over 200 characters (for example a pasted paragraph), nothing is lost, and a shorter search works.", ease_reason: "One small frontend change plus a new or reused message, then turning the existing test.fail into a normal test and adding a unit test. The only decision is the wording.", root_cause: "The API caps q at 200 characters and returns 422 (src/jat/api/search.py:43), but the search box has no length limit (frontend/src/components/HeaderSearch.tsx:32-44). SearchPage treats every error the same and shows the one message from frontend/src/locales/en/notes.ts:57, ignoring the error's reason (frontend/src/pages/SearchPage.tsx:164,177-178).", fix_outline: "In SearchPage.tsx, tell a 422 validation error apart from a real failure and show an honest \"search is too long, 200 characters at most\" line, and stop that error being retried in frontend/src/api/searchHooks.ts. Keep the current message for real failures, since a limit on the box alone would not cover a long ?q= in the address.", pinned_by: "frontend/e2e/timeline-search.spec.ts:448", related_bugs: [], review_notes: "I traced this by reading the code on main at 302ff7b; I did not run the browser test, so its test.fail status is read, not observed. The new message needs Kai's go-ahead. There is an existing validation string, errors.ts:154 \"String should have at most {{count}} characters\", reachable through errorText (frontend/src/api/notifyError.ts:8), but it reads as developer language and may carry a field prefix (I did not read validationText), so a dedicated line is probably better. Two side effects, from reading the code only. The app's QueryClient (frontend/src/App.tsx:22) sets no retry option, so TanStack's default retries should apply to the 422 and delay the message by several seconds. keepPreviousData (searchHooks.ts:14) may also leave the previous search's hits showing under the new long title during that wait. Keep the unit test at frontend/src/components/NotesText.test.tsx:68-77 passing: it pins the current wording for a real failure. The API's 422 for too-long q has no test of its own; tests/test_search.py:117 only covers an empty q. I did not check other fix-* ids for a shared cause. fix-timeline-load-error-silent is nearby in the same spec, but it is a different page and a different problem, so I have not listed it as related."}
      - {id: fix-search-stale-after-rename, type: bug, severity: low, name: "Search results keep a company's old name after a rename", detail: "Renaming doesn't refresh search, so going back to the results shows the old name until they go stale. Found by e2e/timeline-search.spec.ts.", owner: kai, estimate_h: 0.25, prd: docs/prd/tracker.md, ease: trivial, fix_risk: low, data_risk: display-only, changes_english: false, confirmed_by: code-and-test, severity_reason: "Only a display lag of about ten seconds from when the search ran, the saved name is correct, and a real edit usually takes longer than that, so most people going back would see at most a brief flash of the old name or none.", ease_reason: "One added invalidation line in the rename's success handler, plus removing test.fail from the existing e2e test.", root_cause: "useUpdateCompany's success handler (frontend/src/api/detailHooks.ts:49-52) refreshes the companies list and invalidateApplicationViews, but that shared list (frontend/src/api/hooks.ts:50-70) has no [\"search\"] key, despite the comment saying it covers everything showing the company's name. Cached results (frontend/src/api/searchHooks.ts:11) therefore stay fresh for the default 10 second staleTime (frontend/src/App.tsx:22), and going back within that time shows the old name with no refetch.", fix_outline: "Mark search results out of date when a company is renamed, in useUpdateCompany at frontend/src/api/detailHooks.ts:49-52, as the role, people and delete hooks already do, and change the test at frontend/e2e/timeline-search.spec.ts:571 from test.fail to test. Decide whether to add the key to invalidateApplicationViews instead (frontend/src/api/hooks.ts:50), which would also cover other edits that change search text, at the cost of more refetching.", pinned_by: "frontend/e2e/timeline-search.spec.ts:571", related_bugs: [fix-document-usage-stale-after-rename], review_notes: "Browser tests were not run, so the test.fail was read but not seen failing. The test freezes the clock with page.clock.setFixedTime, which keeps the cached results fresh indefinitely. In real use the old name only shows if you go back within 10 seconds of the search having run; after that the page refetches on return, possibly showing the old name briefly first. The roadmap's \"until they go stale\" is accurate, but the window is shorter than the test makes it look. fix-document-usage-stale-after-rename looks to share the cause: the same handler doesn't invalidate [\"document\"]. I read its roadmap entry and the query keys (frontend/src/api/documentHooks.ts:30) but not its test, so it is best fixed in the same place in the same PR. Same gap, not recorded as far as I checked: note, interview, offer, link and document hooks, plus useUpdateApplication and useCreateApplication, also have no \"search\" key in frontend/src/api, so search can lag for up to 10 seconds after those edits too. I traced this by grep, not by test. Fixing it in invalidateApplicationViews would cover many of them, though not useCreateApplication, which doesn't call it. A real decision only if Kai wants that wider fix; the narrow fix stays trivial."}
      - {id: fix-timeline-load-error-silent, type: bug, severity: medium, name: "A Timeline that can't load says there's nothing here", detail: "A failed request falls through to Nothing here yet and advice to widen the filters, with no sign anything went wrong. Found by e2e/timeline-search.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: display-only, changes_english: true, confirmed_by: code-and-test, severity_reason: "No data is harmed and failures should be uncommon on a local app, but a failed load tells the user their history has nothing in it and suggests changing filters or adding entries, which misleads until they reload or notice the separate status indicator.", ease_reason: "One extra render branch on one page, one new string, and turning the existing test.fail into a normal test; other pages already follow this pattern.", root_cause: "frontend/src/pages/TimelinePage.tsx:516 reads only data, isLoading and isFetching from useTimeline, never the error state, and line 517 turns missing data into an empty list. So once loading ends after a failure, the check at line 610 shows the \"Nothing here yet\" empty state and its advice.", fix_outline: "In frontend/src/pages/TimelinePage.tsx, read the query's error state and add a failure branch after the loader at line 609 and before the empty check at line 610, shown only when there is no data, as SearchPage.tsx:167 and InsightsPage.tsx:98 do in their own ways. Add a load-failed string to frontend/src/locales/en/timeline.ts, then make the test a normal test that also expects the new message.", pinned_by: "frontend/e2e/timeline-search.spec.ts:375", related_bugs: [], review_notes: "I read the test but did not run it, since browser tests were out of scope. It is marked test.fail and only checks that \"Nothing here yet\" is absent, so it would pass even with a blank page; the fix should also expect the error message. TimelinePage.test.tsx has no failure case. Needs Kai's go-ahead: the new sentence is shown text, and no existing Timeline string fits. Other pages word it \"Couldn't load ...\", and TodayPage adds \"Is the tracker still running?\". The query client sets no retry option, so React Query's default retries should keep the loader up for several seconds before the wrong message appears. I inferred this from the library's defaults and did not time it. Behaviour to keep in the fix: if a background refresh fails while rows are already showing, data should stay and the rows should remain, so the error branch should only apply when there is no data. I reasoned this from React Query's behaviour and did not test it. A filter change whose new request fails should reach the same wrong message, because the kept previous data lasts only while the new request is pending; this is also unverified. The footer ApiStatus indicator shows offline when the server is down, but it would not flag a 500 from the timeline endpoint alone. fix-weekly-activity-no-error looks like the same kind of problem on Insights, but I only read its roadmap entry, not its code, so I have not listed it as related."}
      - {id: fix-search-note-dead-link, type: bug, severity: low, name: "A search hit on a note can lead to a deleted company", detail: "The note keeps its link to the company (fix-orphan-note-link), so the hit opens Couldn't load this company. Found by e2e/timeline-search.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: none, changes_english: false, confirmed_by: code-and-test, severity_reason: "The note is intact and can still be reached from the Notes page; the only harm is a misleading error page after clicking a search hit whose linked record has been deleted.", ease_reason: "One small backend change in the Places class, plus flipping the test.fail and adding a small API test for the fallback.", root_cause: "Places.path in src/jat/domain/search.py:147-156 builds application, company and agency paths without checking the record exists, unlike role and contact. notes_candidates (search.py:363) therefore takes a dead link from the note's file as its target, because deletes never clean links out of note files (the tidy-up at src/jat/db/models.py:392-399 covers only links, attachments and to-dos).", fix_outline: "Have Places in src/jat/domain/search.py also load the existing application, company and agency ids and return no path for missing ones, as it already does for roles and contacts. notes_candidates then moves on to the note's next live link or falls back to /notes; change the test.fail to a normal test and add an API test for the fallback.", pinned_by: "frontend/e2e/timeline-search.spec.ts:468", related_bugs: [fix-orphan-note-link], review_notes: "I traced this by reading the code and the test.fail. I did not run the browser tests or any Python check. The bug is wider than recorded: a note whose first link is a deleted application or agency hits the same unchecked path, so it should show \"Couldn't load this application\" or \"Couldn't load this agency\". The test only covers a company. A note with a dead first link and a live second link also opens the dead page, even though a good target exists. Interview, role and contact links are already checked, and document links always go to /documents, which is harmless. fix-orphan-note-link has the same underlying cause, stale links left in note files, so the two are best considered together. Even if that fix removes links on delete, this check is still worth having, because existing notes and hand-edited Markdown files can still hold dead links. After the fix, the hit opens the general /notes page, which doesn't single out that note. The test only checks that no error page appears, so it would pass with that behaviour. The shown text doesn't change."}
      - {id: fix-insights-stale-after-new-application, type: bug, severity: low, name: "Insights doesn't count a new application straight away", detail: "Adding one doesn't refresh Insights, so going back shows the old count until the data goes stale and is fetched again, though the API has the new number. Found by e2e/insights.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md, ease: trivial, fix_risk: low, data_risk: display-only, changes_english: false, confirmed_by: code-and-test, severity_reason: "The saved data is right and the count corrects itself: the old number only shows if Insights was fetched under 10 seconds ago, and otherwise only for a moment while it refetches.", ease_reason: "The shared refresh helper already covers Insights; the create hook just needs to call it, and the existing test only loses its test.fail marker.", root_cause: "useCreateApplication (frontend/src/api/hooks.ts:246-250) refreshes only applications, companies, agencies, contacts and roles, and not the [\"insights\"] queries that invalidateApplicationViews (hooks.ts:50) covers. Cached Insights data therefore counts as fresh for the 10-second staleTime (frontend/src/App.tsx:22), and the page shows the old count when you return.", fix_outline: "Have useCreateApplication's onSettled in frontend/src/api/hooks.ts:246 call invalidateApplicationViews, and keep its existing refresh of the companies, agencies, contacts and roles pick-lists. Remove test.fail() at frontend/e2e/insights.spec.ts:311 so the test pins the fix.", pinned_by: "frontend/e2e/insights.spec.ts:311", related_bugs: [], review_notes: "I traced this in the code and read the test, but did not run the browser tests, so the test.fail is not confirmed failing today. The test freezes the clock, so the cache can never go stale; that makes the bug certain in the test, while in real use it is mostly a brief flash of the old number. The same gap affects other views the helper covers but this hook skips: company, agency, contact and role summaries, next actions, timeline, duplicates, interviews, offers and meetings. The fix would refresh those too, which is a small benefit and only a few extra refetches; I did not check each of those pages for visible staleness. I checked fix-refused-delete-stale-page as a possible relative: its tests add the application through the API rather than this hook, so it has a different cause and its test.fail markers should not change. The roadmap's estimate_h of 0.5 still looks right."}
      - {id: fix-weekly-activity-no-error, type: bug, severity: low, name: "Weekly activity spins for ever if it can't load", detail: "Every other part of Insights says it could not load; this one keeps its loader. Found by e2e/insights.spec.ts.", owner: kai, estimate_h: 0.5, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: none, changes_english: true, confirmed_by: code-and-test, severity_reason: "Only a read-only chart is affected, and only when its request fails: the spinner misleads but no data is at risk and the rest of Insights still works.", ease_reason: "One component change following a pattern already used by its siblings, plus one new English string and flipping the existing test.", root_cause: "frontend/src/components/InsightStats.tsx:202 takes only data and isLoading from useActivity, not the error state, and line 217 shows the Loader whenever weeks is missing. A failed request leaves weeks undefined, so the spinner never ends.", fix_outline: "In WeeklyActivity (frontend/src/components/InsightStats.tsx:202 and 217), read the query's error state and show a red failure line, as Scorecard.tsx:83 and the other Insights sections do. Add a weekly.loadFailed string to frontend/src/locales/en/insights.ts (around line 74), and change test.fail to test at frontend/e2e/insights.spec.ts:541.", pinned_by: "frontend/e2e/insights.spec.ts:541", related_bugs: [], review_notes: "I read the code and the test but did not run the browser tests, so the test.fail at line 541 is not confirmed to be failing today; the code trace is clear, though. Needs Kai's go-ahead for one new English sentence, for example \"Couldn't load the weekly activity.\" The test's pattern /could(n.t| not) load/i would accept that wording. In practice this needs a failed request, such as the server being down or erroring, or a browser time zone the server rejects with a 422 (src/jat/api/insights.py:311). WeeklyActivity sits below the tabs on the Insights page (InsightsPage.tsx:125), so the spinner shows on every tab. The legend still shows above the spinner. I looked only at the id, name and code of fix-insights-stale-after-new-application; nothing suggests a shared cause, so it is not listed as related."}
      - {id: fix-event-data-not-dict, type: bug, severity: low, name: "An event whose saved data isn't an object breaks its application's page", detail: "If an event's data column holds JSON null, a list, a string or a number (only possible by hand-editing the database or an export), GET /applications/<id> and /applications/<id>/events return 500, because EventOut requires a dict. POST /activities still returns 201. Found in the review of #168 and confirmed with a throwaway script against main's code (809b6bc); it predates that PR.", owner: lead, estimate_h: 1, prd: docs/prd/tracker.md, ease: easy, fix_risk: low, data_risk: blocks-editing, changes_english: false, confirmed_by: code, severity_reason: "No form or API call can save non-object data (ActivityIn.data is a dict), so it takes hand-editing the database or an export; nothing saved is lost, though one such row can break a whole page.", ease_reason: "One small shared 'treat non-object data as empty' rule, applied in EventOut and the few places that read event data directly, plus a parametrised test; no design or migration needed.", root_cause: "EventOut declares data as dict[str, Any] (src/jat/api/schemas.py:1121), so any non-object value fails validation and returns 500 on GET /applications/<id> (routers.py:444) and /applications/<id>/events (routers.py:936). read_event_msg at schemas.py:1103 tolerates bad data, but it runs too late, in an after-validator. Domain code also assumes an object with `(ev.data or {}).get(...)` and `in data`: src/jat/domain/applications.py:38, 191 and 195-256, and src/jat/api/timeline.py:153.", fix_outline: "Make EventOut treat a non-object data value as empty when reading, and use one small helper for the same rule in is_implied, the _effective_moves helpers in src/jat/domain/applications.py and _event_category in src/jat/api/timeline.py. Add a test that seeds null, list, string and number data and checks the application page, its events, the timeline and the insights endpoints all return 200. Leave the stored value untouched so an export still round-trips.", pinned_by: "none", related_bugs: [], review_notes: "Confirmed at 302ff7b by reading the code and by throwaway scripts on temp folders with made-up data. No browser tests were run, and no existing test pins this: tests/test_event_messages.py (test_old_or_bad_data_gives_no_message_and_keeps_the_rest, about line 223) covers bad messages inside a dict, not data that isn't a dict. The damage is wider than the roadmap entry says: - All four shapes (null, list, string, number) gave 500 on that application's detail and events, and POST /activities still gave 201. Another application's detail stayed 200. - Number data on a non-stage event also gave 500 on /timeline, for every application, not just the affected one. A list on a stage_change event did the same. - A list on a stage_change event with a from_stage also gave 500 on /insights/flow, /insights/whole-flow, /insights/stats, /insights/activity and /insights/documents. - Null on a stage_change event, and a list on a manual event, broke only the application's own endpoints. A string on a manual event also left /timeline at 200. So the 0.5h estimate is low if the fix should cover these too. Fixing only EventOut would leave the timeline and insights 500s. Reachability: I read the restore code's _read_export (src/jat/snapshot/export.py) and saw no shape check on event data, so a hand-edited export could bring this in. I did not run a restore. Unconfirmed: /api/v1/backup/archive returned 500 in one sweep (number data on a manual event) but not in the other three. I did not look into it, and it may be unrelated to this bug. Those sweeps only called GET endpoints with no path parameters, so per-application endpoints other than the two named, including undo, were not exercised; undo_last_move reads `last.data or {}` at applications.py:237, so it likely fails on such data too."}
      - {id: fix-deletes-no-confirm, type: bug, severity: medium, name: "Some deletes don't ask first", detail: "Kai: all deletes should have a confirmation dialog or modal. Removing a link, a to-do or a document sent from an application happens straight away, while most others ask; calls are fix-call-delete-no-confirm. Found by reading the code after e2e/notes-files.spec.ts; the link test there removes one without answering a question, so it changes with the fix.", owner: kai, estimate_h: 1.5, prd: docs/prd/tracker.md, ease: moderate, fix_risk: low, data_risk: loses-or-changes-data, changes_english: true, confirmed_by: code, severity_reason: "One misclick on a small trash icon removes a saved link, to-do or sent-document record at once, with no Undo for links or sent documents; but the loss is visible and the item is small and can be re-entered if remembered.", ease_reason: "Each guard is a small change using the existing window.confirm pattern, but it touches several components, locale files and tests, and Kai must decide whether the to-do delete, which already has Undo, should ask too.", root_cause: "The trash buttons call the delete directly, with no question first: frontend/src/components/Links.tsx:150, frontend/src/components/Todos.tsx:169 and frontend/src/components/SentDocuments.tsx:63. Notes, files, rounds, offers, documents and DeleteButton.tsx:35 all go through window.confirm, so this is a per-button omission rather than a shared fault.", fix_outline: "Put the same window.confirm guard used by the other deletes on those three buttons, naming the item in a new English string in each locale file (files.ts, todos.ts, applications.ts). Update the tests that click these buttons so they accept the question, and add a dismiss case that checks nothing is deleted.", pinned_by: "none", related_bugs: [fix-call-delete-no-confirm], review_notes: "Traced at main 302ff7b by reading the code; no tests were run. No test.fail pins this bug, but ordinary tests currently depend on the immediate delete: frontend/e2e/notes-files.spec.ts:226, application-page.spec.ts:360, documents.spec.ts:448, today.spec.ts:385 and frontend/src/components/Todos.test.tsx:76. As I understand Playwright, an unanswered dialog is auto-dismissed, so these should fail until they accept it; I did not run this. Also missing from the recorded list: removing a person from an application has no confirm either (frontend/src/pages/ApplicationPage.tsx:172, tests at application-page.spec.ts:313 and :567). It only drops the link and role on that application, and the person stays. Kai's \"all deletes\" probably covers it, so it should be added to this fix; it adds one more string and those test edits, which the estimate allows for. Decision for Kai: the to-do delete already shows an Undo toast (frontend/src/api/todoHooks.tsx:134) that restores it, though a done to-do probably gets a new done time. His rule says all deletes should ask, so the outline includes it; asking as well makes Undo partly redundant. fix-call-delete-no-confirm has the same cause (frontend/src/components/Meetings.tsx:360) and is pinned by test.fail at frontend/e2e/interviews-calls.spec.ts:937, so fix it in the same change. Its test.fail marker must then be removed. Together they are a natural single PR. Recovery: an existing message says deleted files stay in the data repo's git history, which suggests older versions of links or sent records may be recoverable. I did not check this for these rows, and it would not be an easy way back for a user. The recorded estimate of 0.5h looks low given the test and string changes. Using window.confirm satisfies \"dialog or modal\" and matches the other deletes; a custom modal would be a larger, separate change."}
      - {id: fix-undo-raw-stage-id, type: bug, severity: low, name: "An undo's line says the stage's id, not its name", detail: "Undoing a move saves the summary 'Undo: back to applied' from the stage's id, so the application timeline and the Timeline page's detail read 'applied' under a title saying 'Applied', and a renamed stage still shows its old id. Confirmed by reading undo_last_move and by test_undo_writes_its_message_with_the_stage_id_its_summary_shows while building i18n-events-activity. Not fixed: English stays as it is. data.msg saves the id, so a fix can look up the name when showing it, for old summaries as well as new messages.", owner: lead, status: planned, estimate_h: 1, ease: easy, fix_risk: low, data_risk: none, changes_english: true, confirmed_by: code-and-test, severity_reason: "It is a cosmetic mismatch in a secondary line: the title right above it already gives the correct stage name, the saved stage and history are right, and nothing is blocked.", ease_reason: "New undo events only need one small display-time lookup, with the stage name passed in at two call sites, plus test updates; the code already has what it needs at both places (drawer's names map, timeline's stage_move). Old undo events are slightly more work if they are in scope.", root_cause: "src/jat/domain/applications.py:229-231 saves the raw stage id in both the summary and the message params, and frontend/src/components/eventText.ts:72-76 (textParams) passes that id straight into \"Undo: back to {{stage}}\" (frontend/src/locales/en/events.ts:49). It shows in ApplicationDrawer.tsx:273 and through timelineDetail in timelineTitle.ts:38-41, without going through stageName.", fix_outline: "Keep saving the id, and at display time turn it into the stage's name via stageName: ApplicationDrawer.tsx already has a names map, and timelineDetail can use the item's stage_move (to_stage and to_name), falling back to the id for a stage no longer in the workflow. Update the comment at events.ts:48 and the tests that pin the id wording; decide separately whether old undo events without a message should change too.", pinned_by: "tests/test_event_messages.py:492 (backend pins the saved id); frontend/src/components/EventsText.test.tsx:105-116 and frontend/src/components/timelineTitle.test.ts:91-97 (display, with stage: \"applied\"). There is no test.fail for it.", related_bugs: [], review_notes: "Traced by reading code at main 302ff7b, and read the tests without running them; browser tests were not run. Needs Kai's go-ahead: the fix changes shown English, e.g. \"Undo: back to applied\" becomes \"Undo: back to Applied\". The roadmap entry says English stays as it is for now. The message template itself need not change. Roadmap detail is too optimistic on one point: it says a lookup at display time covers old summaries too, but I found no migration adding msg to old undo events. Those have no data.msg, so eventText shows the saved summary as it is. Fixing them needs extra matching on the saved text (\"Undo: back to <to_stage>\", to avoid touching typed notes), and the Timeline page's item carries only detail and msg, not data. I could not check how many such events exist in real data, as I did not read the data folder. Leaving them as they are is a reasonable choice. Worse than the entry says in other languages: a translated sentence still has the English id inside it, and a custom stage shows its raw id. The title above (applications.ts:130, \"Undone: back to {{stage}}\", pinned at frontend/e2e/application-page.spec.ts:142) already gives the right name, so the undo line largely repeats it. Hiding that line would be an alternative fix, but that is a product decision. Undo notes typed by a person have no message and are unaffected. Search skips stage_change events (src/jat/domain/search.py:302), so search never shows this line. The summary and _detail in src/jat/api/timeline.py:197-201 still send the English id to API clients; the proposed fix leaves that alone. I searched the roadmap's fix-* entries for stage-id wording and found no related bug."}
      - {id: fix-missing-file-raw-json, type: bug, severity: low, name: "A file missing from the data folder opens raw JSON", detail: "Reproduced in Chrome by a reviewer: attach a PDF, delete it from data/files/, click the link: a new tab shows raw JSON. Not fixed. A file that doesn't open inline shows no JSON: the download is cancelled and the page stays.", owner: lead, status: planned, estimate_h: 2.5, ease: moderate, fix_risk: low, data_risk: display-only, changes_english: false, confirmed_by: code, severity_reason: "It only appears after someone removes a file from the data folder by hand, it changes no saved data, and the JSON does contain a readable message naming the missing file.", ease_reason: "The code is small but needs a decision on where the failure is caught (a plain browser link can't read the response), and there are three separate links to the file.", root_cause: "src/jat/api/attachments.py:183-185 answers a missing file with a coded JSON 404, as for any API call, but the file links are plain anchors the browser opens itself, so nothing in the app reads it: frontend/src/components/Attachments.tsx:81, frontend/src/pages/DocumentsPage.tsx:161 and frontend/src/components/SentDocuments.tsx:47. In a new tab the browser just shows the JSON body.", fix_outline: "Choose one place to catch it: either the server treats a browser page load of this route differently, sending it to an app page that shows the existing attachment_file_missing message, or a shared link component checks first and shows that message on the current page. Use it for all three links, keep the JSON 404 for API callers, and add a backend or e2e test that deletes the file on disk.", pinned_by: "none", related_bugs: [], review_notes: "Traced by reading code at 302ff7b; I ran no tests or browser, so the raw JSON display relies on the code path plus the reviewer's Chrome reproduction recorded in the roadmap. No test covers it: no test.fail exists, tests/test_attachments.py:78 checks a 404 for a different case, and ErrorsText.test.tsx:33 only checks the English text of the code. Wider than recorded: frontend/src/components/SentDocuments.tsx:47 always opens a new tab, so there a missing file of any type should show raw JSON, not just PDFs and images. That is from the code, not reproduced. Search results for a file with no parent use the same URL (src/jat/domain/search.py:322); I didn't trace how the frontend opens them. The other half of the bug is silent: for a non-inline file the download is just cancelled and the page stays, with no message (docs/rfc/i18n.md:257, not re-tested). A proper fix should cover that too, and a server-side approach alone may not, since those links use the download attribute. English: the text attachment_file_missing already exists, so no new wording is strictly required. But \"{{name}} is missing from files/\" is terse, and Kai may want to reword it; a new app page with its own heading would need his go-ahead. Gotcha for the check-first option: the route is GET only, so a HEAD check would need adding, and a new tab must open straight from the click or popup blockers may stop it. The 1h recorded estimate looks low given the three links and that decision. Checked the other file-related fix-* ids by name (fix-file-delete-reason-lost, fix-cv-files-stale): different causes, not related."}
      - {id: fix-holding-other-key, type: bug, severity: low, name: "A Sankey key looks like a plural and isn't, so a new language must repeat it", detail: "sankey.nodes.holding_other in locales/en/insights.ts ('Still at {{stage}}') ends in a plural suffix, which CONTRIBUTING rules out. catalog.ts then treats 'sankey.nodes.holding' as a plural key, so any language with more than one form fails the plural check until it adds holding_one, holding_few and the rest. Found trying a throwaway Polish for i18n-contribute-language: the test failed with that key missing 'one'. English isn't affected. new_language.mjs writes the extra lines, and the guide tells translators to give them the same text. A fix renames the key and SankeyChart's lookup: the code stays holding_other, and the guide's note goes.", owner: lead, status: planned, estimate_h: 0.5, ease: easy, fix_risk: low, data_risk: none, changes_english: false, confirmed_by: code, severity_reason: "It only costs a future translator a few repeated lines, and English users and saved data are untouched, since English is the only language in the repo today.", ease_reason: "One locale key and one lookup get renamed, plus removing or reworking two passages in the translator guide. No design decision, as no translated language files exist yet to migrate.", root_cause: "frontend/src/locales/en/insights.ts:111 names the line holding_other, which matches the plural pattern at frontend/src/i18n/catalog.ts:9 and :74. So compare() (catalog.ts:92-95, 111-113) treats sankey.nodes.holding as a plural, and scripts/i18n/new_language.mjs:33 expands it into every form the language uses. It is the only English key with a plural suffix and no _one partner, and it takes no count.", fix_outline: "Rename the locale key at frontend/src/locales/en/insights.ts:111 to a name without a plural suffix, and update the lookup at frontend/src/components/SankeyChart.tsx:195, leaving the API code holding_other alone (src/jat/api/insights.py, schema.d.ts, SankeyChart.tsx:187 and :193 stay). Then delete the guide note at docs/guide/adding-a-language.md:119-121 and rewrite the worked example at lines 245-262, which uses this key, so it names a real plural.", pinned_by: "none", related_bugs: [], review_notes: "Confirmed by reading the code; I ran no tests. No test pins the bug: the real-locale check in frontend/src/i18n/catalog.test.ts:229 passes today because only English exists, and the Polish failure was seen with a throwaway language that wasn't committed (docs/rfc/i18n.md:421). frontend/src/components/SankeyText.test.tsx:46 pins the shown text 'Still at ...', so it guards the rename but not the bug. Keep the two names apart: the API node code holding_other is not a locale key and must not change, otherwise openapi.json, schema.d.ts and tests/test_insights.py are drawn in. A regression test would be cheap and is worth adding: every English key with a plural suffix must also have its _one partner. That would catch this class of mistake, and it is what the 0.5h assumes at most. The guide's example at docs/guide/adding-a-language.md:245-262 needs real rewording in the translator docs, though no text in the app changes. That guide also says insights.json where the English source is insights.ts, but this is correct for translators, whose files are JSON. The rfc mention at docs/rfc/i18n.md:421 is a historical record and can stay. I checked fix-offer-plurals only by its name line, not in depth: it concerns English plural wording, a different cause, so I did not list it as related."}
      - {id: fix-huge-offset-500, type: bug, severity: low, name: "A huge offset on a list request gives a 500", detail: "GET /api/v1/companies?offset=10**30 (digits, not the expression) returns 500, and likewise /agencies and /roles, because crud.py list_items passes an unbounded offset to the database. Found by the old-against-new comparison of bad requests for i18n-uncoded-errors; the same on main. No form sends it. A fix bounds offset in the query parameter, giving a 422.", owner: lead, status: planned, estimate_h: 0.5, ease: easy, fix_risk: low, data_risk: none, changes_english: false, confirmed_by: code-and-test, severity_reason: "It needs a hand-typed API request with a number beyond 64 bits, no screen in the app sends offset or limit, it only fails that one read, and later requests work normally.", ease_reason: "One function signature in the shared router covers all three lists, plus a small test and regenerated API schema files; the only choice is the bounds, including what to do about negative values.", root_cause: "src/jat/api/crud.py:39 takes limit and offset as unbounded Python ints, and crud.py:43 passes them to SQLite, which cannot bind a number outside 64 bits, so the driver raises and the request ends in a 500.", fix_outline: "Put bounds on both query parameters at src/jat/api/crud.py:39, as src/jat/api/search.py:44 already does, so bad values get a 422, then regenerate frontend/openapi.json and schema.d.ts and add a test for /companies, /agencies and /roles.", pinned_by: "none", related_bugs: [], review_notes: "Confirmed by a throwaway API check at main 302ff7b, using a temp data folder and made-up data; no test in the repo pins this bug, and no browser tests were run. Results were the same on /companies, /agencies and /roles. The bug is wider than recorded: - offset=10**30 gives 500, and so does anything from 2**63 up. 2**63-1 returns 200 with an empty list. - A hugely negative limit (-10**30) also gives 500, so bounding offset alone would leave the same crash. - limit=-1 returns 200, and SQLite treats a negative limit as no limit, so it skips the 1000 cap. In the check it returned the one row saved; I did not test it with more than 1000 rows. - offset=-1 returns 200 with the rows, so a lower bound would turn this into a 422. Things to know for the fix: - Decision: bounding limit at 1 or more would make limit=0 a 422 (it returns 200 and an empty list today), and an upper bound would turn limit above 1000 from silently capped into a 422. Keeping today's cap and allowing 0 is the gentlest choice. These are API behaviour changes for out-of-range values, though nothing in frontend/src sends limit or offset to these lists. Kai may want to check whether this counts as a patch, since CLAUDE.md says to treat unclear cases as major. - Wording: the frontend's locale file already has greater_than_equal and less_than_equal messages (frontend/src/locales/en/errors.ts:144 and :148), so no new English should be needed. New 422 cases may need adding to frontend/src/api/validationIssues.cases.json if that list is meant to cover every endpoint; I did not check that. - Any fix needs the Kai go-ahead CLAUDE.md asks for when behaviour changes. As requested, nothing was fixed or changed in the repo."}
