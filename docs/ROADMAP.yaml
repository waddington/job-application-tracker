      - {id: tests-reorganise, name: "Reorganise the tests: a test file per frontend component next to it, using React Testing Library (already in the project) with shared render helpers in src/test/ (providers, router, API mocks, the i18n instance) and @testing-library/user-event for real typing and clicks (it should also reach Mantine search boxes jsdom can't type into today); page tests kept for whole flows; backend tests grouped by module; a short Testing section in CONTRIBUTING.md (Kai, 2026-10-29)", owner: lead, status: planned, estimate_h: 6, depends: [], prd: docs/prd/tracker.md}
