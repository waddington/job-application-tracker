  - id: P11
    name: Test gaps
    goal: "Text and states the i18n work could only partly test, because the demo data or the tests don't reach them (Kai, 2026-11-01: track them, address them another time)"
    tasks:
      - {id: test-gaps-text-audit, name: "Find what's never tested: a script listing every translation key that no test or text snapshot ever renders, by area, so the other gaps here become an exact list. Today the i18n PRs can only say tests pin 'most of' this text", owner: lead, status: planned, estimate_h: 2, depends: [], prd: docs/prd/tracker.md, rfc: docs/rfc/i18n.md}
      - {id: test-gaps-demo-data, name: "Fill the demo data's holes: it has no attachments, links, closed offers, CV files waiting to be adopted or empty documents, so the text snapshot only reaches empty cards there and offer status words were checked by reading. Add them to scripts/seed_demo.py, using made-up data, and extend scripts/i18n/text_snapshot.py to open those states", owner: lead, status: planned, estimate_h: 2, depends: [], prd: docs/prd/tracker.md, rfc: docs/rfc/i18n.md}
      - {id: test-gaps-snapshot-states, name: "Check each text snapshot view reaches the state it's named after: timeline+only-files was never confirmed to reach its empty state, for example, and some Timeline states can't be reached at all. Fail or warn when a view shows a different state", owner: lead, status: planned, estimate_h: 1.5, depends: [test-gaps-demo-data], prd: docs/prd/tracker.md, rfc: docs/rfc/i18n.md}
