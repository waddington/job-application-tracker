      - {id: i18n-contribute-language, name: "A Don't see your language? item in the language switch, linking to a guide on GitHub for adding one: which files to copy and where (locales/<code>/, LANGUAGES and LANGUAGE_NAMES, the dayjs locale and date patterns), the checks to run (the key, plural-form and placeholder tests, typecheck, lint), trying it with the pseudo-language and pnpm dev, the before/after text check, and opening a PR (Kai, 2026-10-30)", owner: lead, status: planned, estimate_h: 2, depends: [i18n-finish, i18n-switcher], prd: docs/prd/tracker.md, rfc: docs/rfc/i18n.md}
      - {id: i18n-default-stages, name: "The default stages shown in your language: a stage that still has its default id and default English name (applied named Applied) shows translated everywhere a stage shows (badges, board columns, filters, menus, Sankeys, timelines); renamed or added stages show as written, and config.toml never changes (Kai, 2026-10-30: option 2)", owner: lead, status: planned, estimate_h: 2, depends: [i18n-finish], prd: docs/prd/tracker.md, rfc: docs/rfc/i18n.md}
