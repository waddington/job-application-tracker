# job-application-tracker delivery roadmap. The PM dashboard (tools/pm) reads this file.
#
# Strict YAML subset (the dashboard parses it with the standard library only): block mappings
# and lists, one-line scalars, [flow, lists] and one-line {flow: mappings}. No anchors and no
# multi-line strings.
#
# status: planned | building | review | done | blocked
#   A task whose branch (worktree-<id>) or PR exists takes its LIVE status from git and
#   GitHub: building while the branch has commits but no PR, review while the PR is open,
#   done once merged. The status written here is the fallback when there's no live evidence.
# owner: lead (Claude) or kai (waiting on Kai).
# estimate_h: agent hours.
# prd / rfc: optional repo-relative paths.

project: job-application-tracker
repo: waddington/job-application-tracker
start: 2026-09-30

phases:
  - id: P0
    name: Foundations
    goal: Planning, a PM dashboard and the stack decision
    tasks:
      - {id: prd-tracker, name: "Product PRD, roadmap and planning docs", owner: lead, status: review, estimate_h: 2, depends: [], prd: docs/prd/tracker.md}
      - {id: pm-dashboard, name: "PM dashboard web app (tools/pm)", owner: lead, status: building, estimate_h: 4, depends: [prd-tracker]}
      - {id: readme, name: "Public README: catchy, search- and LLM-friendly", owner: lead, status: building, estimate_h: 1.5, depends: [prd-tracker]}
      - {id: stack-rfc, name: "Stack and data-format RFC", owner: lead, status: planned, estimate_h: 3, depends: [prd-tracker], prd: docs/prd/tracker.md}
      - {id: stack-gate, name: "Kai signs off the stack RFC", owner: kai, status: blocked, estimate_h: 0.5, depends: [stack-rfc]}

  - id: P1
    name: Core data and workflow
    goal: Data directory, schema, configurable workflow and a local JSON API
    tasks:
      - {id: data-dir, name: "Configurable data directory, init and backup layout", owner: lead, status: planned, estimate_h: 2, depends: [stack-gate], prd: docs/prd/tracker.md}
      - {id: schema, name: "Entities: companies, agencies, contacts, roles, applications", owner: lead, status: planned, estimate_h: 4, depends: [data-dir], prd: docs/prd/tracker.md}
      - {id: workflow, name: "Configurable stages, transitions and event history", owner: lead, status: planned, estimate_h: 4, depends: [schema], prd: docs/prd/tracker.md}
      - {id: api, name: "Local JSON API for every action", owner: lead, status: planned, estimate_h: 3, depends: [schema], prd: docs/prd/tracker.md}
      - {id: app-shell, name: "Web app shell: navigation, theming, layout", owner: lead, status: planned, estimate_h: 3, depends: [stack-gate], prd: docs/prd/tracker.md}

  - id: P2
    name: Tracking views
    goal: See and move every application
    tasks:
      - {id: app-list, name: "Applications list with filters and search", owner: lead, status: planned, estimate_h: 4, depends: [api, app-shell], prd: docs/prd/tracker.md}
      - {id: board, name: "Board view with allowed-transition drag and drop", owner: lead, status: planned, estimate_h: 3, depends: [workflow, app-list], prd: docs/prd/tracker.md}
      - {id: detail-pages, name: "Application, role, company and contact pages with timeline", owner: lead, status: planned, estimate_h: 4, depends: [api, app-shell], prd: docs/prd/tracker.md}
      - {id: recruiters, name: "Recruiter and agency pages: contact details, roles, notes", owner: lead, status: planned, estimate_h: 2, depends: [detail-pages], prd: docs/prd/tracker.md}
      - {id: dup-warning, name: "Duplicate-submission warning", owner: lead, status: planned, estimate_h: 1, depends: [schema], prd: docs/prd/tracker.md}
      - {id: readme-refresh-1, name: "README refresh: tracking views, screenshots with fake data", owner: lead, status: planned, estimate_h: 1, depends: [app-list, board, detail-pages, recruiters]}

  - id: P3
    name: Notes, documents and interviews
    goal: Everything about an application in one place
    tasks:
      - {id: notes, name: "Markdown notes on any entity, and general notes", owner: lead, status: planned, estimate_h: 3, depends: [detail-pages], prd: docs/prd/tracker.md}
      - {id: links, name: "External links such as Google Docs", owner: lead, status: planned, estimate_h: 1, depends: [detail-pages], prd: docs/prd/tracker.md}
      - {id: attachments, name: "File attachments stored in the data directory", owner: lead, status: planned, estimate_h: 3, depends: [detail-pages], prd: docs/prd/tracker.md}
      - {id: eml-import, name: "Email export (.eml) parsing into the timeline", owner: lead, status: planned, estimate_h: 2, depends: [attachments], prd: docs/prd/tracker.md}
      - {id: documents, name: "Versioned CVs and cover letters, with where each was used", owner: lead, status: planned, estimate_h: 2, depends: [attachments], prd: docs/prd/tracker.md}
      - {id: interviews, name: "Interviews and coding tasks: schedule, prep, debrief, questions", owner: lead, status: planned, estimate_h: 3, depends: [detail-pages], prd: docs/prd/tracker.md}

  - id: P4
    name: Next actions
    goal: Nothing goes quiet unnoticed
    tasks:
      - {id: next-actions, name: "Next actions page: stale applications, upcoming interviews and deadlines", owner: lead, status: planned, estimate_h: 4, depends: [workflow, interviews], prd: docs/prd/tracker.md}
      - {id: followups, name: "Follow-up dates, snooze and one-click Ghosted", owner: lead, status: planned, estimate_h: 2, depends: [next-actions], prd: docs/prd/tracker.md}
      - {id: readme-refresh-2, name: "README refresh: notes, documents, interviews and Next actions", owner: lead, status: planned, estimate_h: 1, depends: [notes, documents, interviews, followups]}

  - id: P5
    name: Insights
    goal: How the search is going
    tasks:
      - {id: sankey, name: "Sankey diagram of stage flows", owner: lead, status: planned, estimate_h: 3, depends: [workflow, app-shell], prd: docs/prd/tracker.md}
      - {id: stats, name: "Conversion, time in stage, direct vs recruiter, weekly activity", owner: lead, status: planned, estimate_h: 4, depends: [workflow, app-shell], prd: docs/prd/tracker.md}
      - {id: scorecard, name: "Recruiter scorecard", owner: lead, status: planned, estimate_h: 2, depends: [stats, recruiters], prd: docs/prd/tracker.md}
      - {id: readme-refresh-3, name: "README refresh: Sankey and insights, demo GIF", owner: lead, status: planned, estimate_h: 1, depends: [sankey, stats, scorecard]}

  - id: P6
    name: Extras
    goal: Nice to have once the core works
    tasks:
      - {id: offers, name: "Offer comparison, pay terms, contract day rate and IR35", owner: lead, status: planned, estimate_h: 2, depends: [detail-pages], prd: docs/prd/tracker.md}
      - {id: ics-export, name: ".ics export for interviews", owner: lead, status: planned, estimate_h: 1, depends: [interviews], prd: docs/prd/tracker.md}
      - {id: backup-export, name: "One-click backup archive of the data directory", owner: lead, status: planned, estimate_h: 2, depends: [data-dir], prd: docs/prd/tracker.md}
      - {id: search, name: "Full-text search across notes and entities", owner: lead, status: planned, estimate_h: 3, depends: [notes], prd: docs/prd/tracker.md}
      - {id: readme-refresh-4, name: "README refresh: extras, install guide, v1 release notes", owner: lead, status: planned, estimate_h: 1, depends: [offers, ics-export, backup-export, search]}
